services:
  clickhouse:
    # ClickHouse 25.12 is the Langfuse v4 minimum (events tables require the
    # >=25.x text indexes / enable_full_text_index). All dev and CI deploy-mode
    # configs pin the same version.
    image: docker.io/clickhouse/clickhouse-server:25.12
    user: "101:101"
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-langfuse-clickhouse}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - ${HOST_IP:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${HOST_IP:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    depends_on:
      - postgres
    networks:
      - default

  floci:
    image: docker.io/floci/floci:1.7.0-compat
    container_name: ${FLOCI_CONTAINER_NAME:-langfuse-floci}
    environment:
      AWS_ACCESS_KEY_ID: ${FLOCI_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FLOCI_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${FLOCI_REGION:-us-east-1}
      FLOCI_HOSTNAME: floci
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: 120
      FLOCI_S3_CORS_ALLOWED_ORIGINS: "${FLOCI_S3_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-persistent}
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_S3_BUCKET: ${FLOCI_S3_BUCKET:-langfuse}
    ports:
      - ${HOST_IP:-127.0.0.1}:${FLOCI_PORT:-4566}:4566
    volumes:
      - langfuse_floci_data:/app/data
      - ./scripts/code-eval-runners/bootstrap-floci-s3.py:/etc/floci/init/ready.d/01-bootstrap-s3.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "aws --endpoint-url=http://localhost:4566 s3api head-bucket --bucket $${FLOCI_S3_BUCKET} >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 1s
    networks:
      - default

  redis:
    image: docker.io/redis:7.2.4
    container_name: ${REDIS_CONTAINER_NAME:-langfuse-redis}
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:-myredissecret}
      --maxmemory-policy noeviction
    ports:
      - ${HOST_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379
    networks:
      - default

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    container_name: ${POSTGRES_CONTAINER_NAME:-langfuse-postgres}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=UTC
      - PGTZ=UTC
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  langfuse_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-langfuse_postgres_data}
    driver: local
  langfuse_clickhouse_data:
    name: ${CLICKHOUSE_DATA_VOLUME_NAME:-langfuse_clickhouse_data}
    driver: local
  langfuse_clickhouse_logs:
    name: ${CLICKHOUSE_LOGS_VOLUME_NAME:-langfuse_clickhouse_logs}
    driver: local
  langfuse_floci_data:
    name: ${FLOCI_VOLUME_NAME:-langfuse_floci_data}
    driver: local

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-langfuse-network}
    driver: bridge
