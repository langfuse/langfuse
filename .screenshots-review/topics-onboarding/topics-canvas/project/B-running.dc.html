<x-dc>

</style>
</helmet>
<div style="width: 100%; height: 800px; display: flex; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; color: #18181b; background: #ffffff; overflow: hidden">
  <nav style="width: 200px; flex: none; border-right: 1px solid #e4e4e7; background: #fafafa; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px">
    <div style="font-weight: 600; font-size: 16px; padding: 4px 8px 14px">langfuse</div>
    <div style="padding: 7px 8px; color: #3f3f46">Home</div>
    <div style="padding: 7px 8px; color: #3f3f46">Tracing</div>
    <div style="padding: 7px 8px; color: #3f3f46">Sessions</div>
    <div style="padding: 7px 8px; color: #3f3f46">Users</div>
    <div style="padding: 7px 8px; background: #ececee; border-radius: 6px; font-weight: 500">Topics</div>
    <div style="padding: 7px 8px; color: #3f3f46">Alerts</div>
    <div style="padding: 7px 8px; color: #3f3f46">Prompts</div>
    <div style="padding: 7px 8px; color: #3f3f46">Scores</div>
  </nav>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 52px; flex: none; border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
      <div style="font-weight: 600; font-size: 16px">Topics</div>
      <button aria-label="More actions" style="background: transparent; border: 0; padding: 7px 8px; font: inherit; color: #52525b">•••</button>

    <div style="margin: 20px 40px 0; border: 1px solid #d4d4d8; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #fafafa">
      <span style="font-weight: 500">Keep finding topics in new traces?</span>
      <div style="display: flex; gap: 8px">
        <button style="background: #f4f4f5; color: #18181b; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit">Not now</button>
        <button style="background: #18181b; color: #ffffff; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit">Turn on</button>
      </div>
    </div>
    <section style="flex: 1; display: flex; gap: 32px; padding: 24px 40px; align-items: flex-start; flex-wrap: wrap">
      <div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

          <span style="background: #f4f4f5; color: #a1a1aa; border-radius: 6px; padding: 4px 10px; font-size: 12px">Outcome</span>
          <span style="background: #f4f4f5; color: #a1a1aa; border-radius: 6px; padding: 4px 10px; font-size: 12px">Issues</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="border: 1px solid #e4e4e7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between"><span style="font-weight: 500">● Langfuse help</span><span style="color: #52525b">24</span></div>
            <div style="height: 6px; border-radius: 3px; background: #6d28d9"></div>
          </div>
          <div style="border: 1px solid #e4e4e7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between"><span style="font-weight: 500">● Dashboard widgets</span><span style="color: #52525b">22</span></div>
            <div style="height: 6px; width: 92%; border-radius: 3px; background: #2563eb"></div>
          </div>
          <div style="border: 1px dashed #e4e4e7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="height: 12px; width: 60%; border-radius: 4px; background: #f1f1f3"></div>
            <div style="height: 6px; width: 70%; border-radius: 3px; background: #f1f1f3"></div>
          </div>
          <div style="border: 1px dashed #e4e4e7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="height: 12px; width: 45%; border-radius: 4px; background: #f1f1f3"></div>
            <div style="height: 6px; width: 50%; border-radius: 3px; background: #f1f1f3"></div>
          </div>
        </div>
      </div>
      <div style="flex: 1 1 340px; max-width: 380px; border: 1px solid #d4d4d8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="font-size: 16px; font-weight: 600">Finding topics…</div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Intent</span><span style="color: #166534">Done</span></div>
          <div style="height: 6px; border-radius: 3px; background: #16a34a"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Sentiment</span><span style="color: #166534">Done</span></div>
          <div style="height: 6px; border-radius: 3px; background: #16a34a"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Outcome</span><span style="color: #52525b">60%</span></div>
          <div style="height: 6px; border-radius: 3px; background: #f1f1f3"><div style="height: 6px; width: 60%; border-radius: 3px; background: #18181b"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Issues</span><span style="color: #71717a">Waiting</span></div>
          <div style="height: 6px; border-radius: 3px; background: #f1f1f3"></div>
        </div>
      </div>
    </section>
  </main>
</div>
