<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v2 auto-analyze settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#52525b}a:hover{color:#18181b}
</style>
</helmet>
<div style="width: 100%; height: 800px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; color: #18181b; background: #c9c9cf; overflow: hidden">
  <div style="width: 540px; max-width: 94%; background: #ffffff; border-radius: 14px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 18px; font-weight: 600">Auto-analyze</div>
      <button aria-label="Close" style="background: transparent; border: 0; font: inherit; font-size: 18px; color: #71717a">×</button>
    </div>
    <label style="display: flex; justify-content: space-between; align-items: center; background: #f4f2fb; border-radius: 10px; padding: 14px 16px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Analyze new traces</span><span style="color: #52525b; font-size: 13px">Each trace, 10 min after it goes quiet</span></span>
      <span style="width: 40px; height: 22px; border-radius: 11px; background: #18181b; position: relative; flex: none"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff"></span></span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between"><span style="font-weight: 600">How many</span><span style="font-weight: 600">100%</span></div>
      <div style="height: 6px; border-radius: 3px; background: #18181b; position: relative"><span style="position: absolute; right: -8px; top: -6px; width: 18px; height: 18px; border-radius: 9px; background: #fff; border: 2px solid #18181b; box-sizing: border-box"></span></div>
      <div style="color: #71717a; font-size: 13px">≈ 1,280 traces a week</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #f1f1f3; padding-top: 14px; font-size: 13px; color: #52525b">
      <div style="display: flex; justify-content: space-between"><span>Models</span><span>Bedrock, recommended · <a href="#settings">Change</a></span></div>
      <div style="display: flex; justify-content: space-between"><span>Topics regroup</span><span>When you choose Run › Regroup</span></div>
      <div style="display: flex; justify-content: space-between"><span>Not included</span><span>Legacy ingestion</span></div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button style="background: #f4f4f5; color: #18181b; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit">Cancel</button>
      <button style="background: #18181b; color: #ffffff; border: 0; border-radius: 6px; padding: 9px 16px; font: inherit; font-weight: 500">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
