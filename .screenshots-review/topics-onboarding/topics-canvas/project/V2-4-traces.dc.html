<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v2 setup step 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#52525b}a:hover{color:#18181b}
</style>
</helmet>
<div style="width: 100%; height: 800px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; color: #18181b; background: #c9c9cf; overflow: hidden">
  <div style="width: 600px; max-width: 94%; background: #ffffff; border-radius: 14px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 18px; font-weight: 600">Which traces?</div>
        <div style="color: #71717a; font-size: 13px">Step 2 of 2</div>
      </div>
      <button aria-label="Close" style="background: transparent; border: 0; font: inherit; font-size: 18px; color: #71717a">×</button>
    </div>
    <label style="border: 2px solid #18181b; border-radius: 12px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <span style="width: 36px; height: 20px; border-radius: 10px; background: #18181b; position: relative; flex: none"><span style="position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff"></span></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">New traces, from now on</span><span style="color: #71717a; font-size: 13px">Recommended · topics stay up to date</span></span>
      <span style="border: 1px solid #e4e4e7; border-radius: 6px; padding: 4px 10px; font-size: 13px">100% ▾</span>
    </label>
    <label style="border: 1px solid #e4e4e7; border-radius: 12px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <input type="checkbox" checked="checked" style="width: 18px; height: 18px; margin: 0 9px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Past traces too</span><span style="color: #71717a; font-size: 13px">1,280 traces · gives you topics right away</span></span>
      <span style="border: 1px solid #e4e4e7; border-radius: 6px; padding: 4px 10px; font-size: 13px">Last 7 days ▾</span>
    </label>
    <div style="color: #52525b; font-size: 13px; padding-left: 4px">Filter or paste trace IDs ▸</div>
    <div style="background: #f4f2fb; border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">First topics in about 5 min</span><span style="color: #52525b; font-size: 13px">Est. [est. cost] on your Bedrock key</span></span>
      <span style="font-size: 12px; color: #6d28d9; font-weight: 500">1,280 traces</span>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 8px">
      <button style="background: #f4f4f5; color: #18181b; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit">Back</button>
      <button style="background: #18181b; color: #ffffff; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 500">Start</button>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
