<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#52525b}a:hover{color:#18181b}
</style>
</helmet>
<div style="width: 100%; height: 800px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; color: #18181b; background: #c9c9cf; overflow: hidden">
  <div style="width: 560px; max-width: 94%; background: #ffffff; border-radius: 12px; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 18px; font-weight: 600">Set up Topics</div>
        <div style="color: #71717a; font-size: 13px">For this project</div>
      </div>
      <button aria-label="Close" style="background: transparent; border: 0; font: inherit; font-size: 18px; color: #71717a">×</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 600">Model</div>
      <div style="border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center">
        <span>Bedrock · eu-central-1</span>
        <span style="color: #71717a">▾</span>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="background: #ecfdf3; color: #166534; border-radius: 6px; padding: 3px 8px; font-size: 12px">✓ Recommended models picked</span>
        <span style="background: #f4f4f5; color: #52525b; border-radius: 6px; padding: 3px 8px; font-size: 12px">Haiku 5.5</span>
        <span style="background: #f4f4f5; color: #52525b; border-radius: 6px; padding: 3px 8px; font-size: 12px">Cohere embed v4</span>
        <span style="background: #f4f4f5; color: #52525b; border-radius: 6px; padding: 3px 8px; font-size: 12px">Sonnet 5.5</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 600">Look for</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="border: 1px solid #18181b; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
          <input type="checkbox" checked="checked" style="margin-top: 2px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Intent</span><span style="color: #71717a; font-size: 12px">"Refund an order"</span></span>
        </label>
        <label style="border: 1px solid #18181b; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
          <input type="checkbox" checked="checked" style="margin-top: 2px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Sentiment</span><span style="color: #71717a; font-size: 12px">"Frustrated"</span></span>
        </label>
        <label style="border: 1px solid #18181b; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
          <input type="checkbox" checked="checked" style="margin-top: 2px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Outcome</span><span style="color: #71717a; font-size: 12px">"Completed"</span></span>
        </label>
        <label style="border: 1px solid #18181b; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
          <input type="checkbox" checked="checked" style="margin-top: 2px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Issues</span><span style="color: #71717a; font-size: 12px">"Wrong tool called"</span></span>
        </label>
      </div>
    </div>
    <div style="border-top: 1px solid #e4e4e7; padding-top: 14px; display: flex; justify-content: space-between; color: #52525b">
      <span>Advanced settings</span>
      <span>▸</span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button style="background: #f4f4f5; color: #18181b; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit">Cancel</button>
      <button style="background: #18181b; color: #ffffff; border: 0; border-radius: 6px; padding: 9px 16px; font: inherit; font-weight: 500">Start</button>
    </div>
  </div>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
