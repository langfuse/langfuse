# Override for docker-compose.build.yml: adds Keycloak and a fake LLM gateway
# and turns on OAuth2 client credentials for LLM connections.
#
#   bash scripts/e2e/llm-oauth2/setup.sh
#   docker compose --env-file scripts/e2e/llm-oauth2/compose.env \
#     -f docker-compose.build.yml \
#     -f scripts/e2e/llm-oauth2/docker-compose.oauth2.yml up -d --build
#
# `--env-file` keeps Compose from reading the repository-root .env (see
# compose.env). Compose resolves relative paths against the first -f file, so
# the paths below are relative to the repository root. See README.md.

name: lf-oauth2-e2e

x-oauth2-e2e-env: &oauth2-e2e-env
  LANGFUSE_LLM_OAUTH2_ALLOWED_TOKEN_ENDPOINTS: http://keycloak:8080/realms/lf-e2e/protocol/openid-connect/token,http://fake-llm:8090/fault/token
  # http token endpoints and LLM base URLs on the compose network are only
  # accepted for hosts listed here.
  LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: keycloak,fake-llm
  LANGFUSE_LLM_OAUTH2_TOKEN_MAX_RETRIES: "2"
  LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-lf-e2e-org}
  LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-OAuth2 e2e}
  LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-lf-e2e-project}
  LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-OAuth2 e2e}
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-e2e-oauth2}
  LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-e2e-oauth2}
  LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-e2e@langfuse.local}
  LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-OAuth2 e2e}
  LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-e2e-password}

services:
  langfuse-web:
    environment: *oauth2-e2e-env

  langfuse-worker:
    environment: *oauth2-e2e-env

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./scripts/e2e/llm-oauth2/generated/realm.json:/opt/keycloak/data/import/lf-e2e-realm.json:ro
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/lf-e2e HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  fake-llm:
    image: node:24.11.0-alpine
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: "8090"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: lf-e2e
    volumes:
      - ./scripts/e2e/llm-oauth2/fake-llm:/app:ro
    ports:
      - "127.0.0.1:18090:8090"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
