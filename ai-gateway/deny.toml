# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `pnpm --filter ai-gateway run rust:deny` (or `cargo deny check`).

[graph]
all-features = true

[advisories]
# RustSec advisories. Vulnerabilities and unsound crates fail the check; add an
# entry with a reason here only after confirming an advisory does not apply.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# Permissive licenses only. Copyleft licenses (GPL, LGPL, MPL, AGPL, ...) need
# a deliberate review before being added because the gateway ships as a binary.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
