[package]
name = "ai-gateway-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
bytes = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
