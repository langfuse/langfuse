[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1.1"
hmac = "0.13"
http-body-util = "0.1"
futures-util = "0.3"
opentelemetry-http = "0.33"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "internal-logs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
reqwest-middleware = "0.5"
reqwest-tracing = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.1", default-features = false, features = ["v7", "std"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
http-body = "1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["testing"] }
prost = "0.14"
tokio = { version = "1.53.1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Avoid requiring annotations on every side-effect-free getter.
must_use_candidate = "allow"

# Suppressions must use `#[expect(lint, reason = "...")]` so stale ones fail.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Request paths must not panic; tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

await_holding_lock = "deny"
rc_buffer = "deny"
rc_mutex = "deny"

# `process::exit` and `mem::forget` skip `Drop`, so graceful shutdown and
# telemetry flushing would not run. `clippy::exit` ignores `fn main`, so
# `clippy.toml` also lists `std::process::exit` under `disallowed-methods`.
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"

# Large futures and stack frames increase memory use and can exhaust the stack.
large_futures = "warn"
large_stack_frames = "warn"

redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
iter_with_drain = "warn"
set_contains_or_insert = "warn"

infinite_loop = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
mutex_atomic = "warn"
try_err = "warn"
unused_result_ok = "warn"
error_impl_error = "warn"

[profile.release]
lto = "thin"
strip = true
