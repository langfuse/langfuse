[package]
name = "gateway-bench-tools"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "mock-upstream"
path = "src/mock.rs"

[[bin]]
name = "loadgen"
path = "src/loadgen.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
memchr = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
