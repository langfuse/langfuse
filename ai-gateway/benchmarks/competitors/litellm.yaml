# LiteLLM proxy config for the competitor benchmark. Every optional per-request
# step the Langfuse gateway does not perform is off, so LiteLLM does the same or
# less work per request:
# - one static master key instead of database-backed virtual keys, so no key,
#   budget or spend lookups and no database at all;
# - no Redis, callbacks, guardrails, rate limits or response cache;
# - no token counting and no streaming success logging, which is where LiteLLM
#   rebuilds the streamed response, calculates cost and runs callbacks. Its
#   tracing callback cannot run without that step, so tracing is off too.
model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      # api.openai.com resolves to the mock upstream on the benchmark network.
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  disable_spend_updates: true
  disable_error_logs: true
  # Per-worker admission control, sized so both workers together admit about
  # as many requests as the Langfuse gateway's derived memory budget (1,602).
  max_in_flight_requests_per_worker: 800
  max_queued_requests_per_worker: 0

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  disable_token_counter: true
  disable_streaming_logging: true

router_settings:
  enable_pre_call_checks: false
