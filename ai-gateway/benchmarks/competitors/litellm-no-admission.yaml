# litellm.yaml without per-worker admission control (LiteLLM's default), to see
# how it behaves as memory runs out. Otherwise identical: the project's
# production guide (docs.litellm.ai/docs/proxy/prod) and server tuning page.
# The response cache stays off: every benchmark request has the same body, so a
# cache would answer from Redis instead of proxying to the upstream.
model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      # api.openai.com resolves to the mock upstream on the benchmark network.
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  disable_error_logs: true

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  # Usage-only traces, comparable to the Langfuse gateway's USAGE ingestion mode.
  callbacks: ["langfuse_otel"]
  turn_off_message_logging: true

router_settings:
  redis_host: redis
  redis_port: 6379
  redis_password: myredissecret
