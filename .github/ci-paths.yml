# Dependencies, build and CI setup shared by every live suite.
infra: &infra
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - turbo.json
  - .env.dev.example
  - docker-compose.dev.yml
  - .github/workflows/pipeline.yml
  - .github/ci-paths.yml
  - scripts/ci/**
  - scripts/vitest/**
  - packages/config-typescript/**
  - packages/shared/package.json
  - packages/shared/tsconfig*.json
  - worker/package.json
  - worker/tsconfig*.json

# Common inputs affect both the LLM connection and AI gateway suites.
common: &common
  - *infra
  - packages/shared/{src,prisma,clickhouse,scripts}/**

llm_connections:
  - *common
  - worker/vitest.config.ts
  - worker/src/__tests__/llmConnections.test.ts
  - worker/src/__tests__/helpers/localLlmServer.ts

# Code that builds, sends or parses Topics summary and naming requests.
topics_llm:
  - *infra
  - worker/vitest.config.ts
  - worker/src/features/topics/llm/**
  - worker/src/features/topics/{event-loop,metrics,provider-error,summaryResult}.ts
  - worker/src/services/exportVolumeMetric.ts
  - packages/shared/src/topics/**
  - packages/shared/src/server/topics/{text,embeddings,model-config}.ts
  - packages/shared/src/server/llm/**
  - packages/shared/src/server/outbound-url/**
  - packages/shared/src/encryption/**
  - packages/shared/src/interfaces/customLLMProviderConfigSchemas.ts

ai_gateway:
  - *common
  - ai-gateway/**
  - packages/native/**
  - web/package.json
  - web/tsconfig*.json
  - web/vitest.config.mts
  - web/vitest.server.config.mts
  - web/vitest.shared.mts
  - web/next.config.*
  - web/src/env.mjs
  - web/src/instrumentation.ts
  - web/src/middleware.ts
  - web/src/__e2e__/ai-gateway/**
  - web/src/__tests__/fixtures/feature-flags.ts
  - web/src/features/ai-gateway/**
  - web/src/features/public-api/server/**
  - web/src/features/auth/policy/**
  - web/src/features/rbac/{authorize,types}.ts
  - web/src/features/rbac/utils/checkOrganizationAccess.ts
  - web/src/features/entitlements/server/**
  - web/src/pages/api/internal/ai-gateway/**
  - web/src/pages/api/public/ingestion.ts
  - web/src/pages/api/public/media/**
  - web/src/pages/api/public/otel/**
  - web/src/server/**
  - worker/src/*.ts
  - worker/src/features/{otel-ingestion,otel-media}/**
  - worker/src/services/**
  - worker/src/queues/**
  - worker/src/utils/**
  - worker/src/ee/fipsMode.ts
  - worker/src/constants/default-model-prices.json
