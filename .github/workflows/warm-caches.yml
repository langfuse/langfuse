name: Warm CI caches

# Main-branch cache entries can be restored by other refs. Since the main
# pipeline skips commits already tested by the merge queue, build these
# profiles periodically so other branches can reuse their task artifacts.
on:
  schedule:
    # Every 6 hours, offset from the top of the hour to dodge runner-pool
    # congestion. Frequency chosen to stay under the observed hours-scale
    # cache lifetime.
    - cron: "23 */6 * * *"
  # Only the nextjs-e2e job runs on push; it needs a cache built from the
  # commit PRs and merge-queue runs are based on, not one up to 6h old.
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate groups so a queued push run never replaces a pending scheduled
  # run (or the reverse); within a group the newest pending run wins.
  group: warm-caches-${{ github.event_name == 'push' && 'push' || 'periodic' }}

env:
  # Keep in sync with NODE_VERSION in pipeline.yml.
  NODE_VERSION: 24

jobs:
  warm:
    if: github.event_name != 'push'
    # Match the pipeline's runner provider for cache compatibility.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    name: warm (${{ matrix.cache_scope }})
    env:
      # Mirror the consuming test jobs so Turbo task hashes match.
      NODE_ENV: test
    strategy:
      # One profile failing must not cancel the other warmer — a partially
      # warmed pool still helps.
      fail-fast: false
      matrix:
        include:
          - cache_scope: tests-web-compile
            deploy-mode: ""
            env_profile: tests-web
          - cache_scope: server-e2e
            deploy-mode: ""
            env_profile: e2e-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read devEngines.packageManager from package.json so workflows use
      # the same pinned pnpm version.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false
      - name: Use Node.js ${{ env.NODE_VERSION }} with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] scheduled cache warmer for test-job dependency caches only; runs on main, no released artifacts are built or published from this cached state
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: |
          pnpm install
      - name: Load default env
        # Must stay byte-identical to the matching pipeline job: Turbo hashes
        # the whole .env, so even test-only differences invalidate the build.
        run: |
          if [ "${{ matrix.env_profile }}" = "tests-web" ]; then
            bash scripts/ci/write-web-test-env.sh ".env.dev${{ matrix.deploy-mode }}.example" .env
          else
            cp .env.dev${{ matrix.deploy-mode }}.example .env
          fi
      - name: Setup Turbo remote cache
        continue-on-error: true
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          provider: github
          cache-prefix: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-turbo-ci-
          use-relative-cache-path: true
          server-port: "0"
      - name: Build
        # dev containers / Postgres are not needed: the build task only
        # depends on db:generate, which is offline.
        run: |
          if [ "${{ matrix.env_profile }}" = "tests-web" ]; then
            NEXT_DISABLE_BUILD_CACHE=true pnpm turbo run build:test
          else
            pnpm run build --filter=!ai-gateway
          fi
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          # TypeScript is checked explicitly in the lint job; skip duplicate
          # Next.js type checks to keep the warmer cheap (mirrors tests-web).
          NEXT_IGNORE_BUILD_ERRORS: "true"

  # Saves the Next.js (Turbopack) build cache that e2e-tests and
  # e2e-server-tests in pipeline.yml restore. Those jobs only restore, so this
  # job is the only writer. Main-scoped entries are the only ones every PR and
  # merge-queue run can read.
  nextjs-e2e:
    # Another ref's saves are only readable from that ref, so a run anywhere
    # but main (e.g. a manual dispatch on a branch) would only add an unused
    # entry.
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      # Mirror the e2e jobs so the web build — and its turbo hash — match.
      NODE_ENV: test
      NEXT_IGNORE_BUILD_ERRORS: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false
      - name: Use Node.js ${{ env.NODE_VERSION }} with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] cache warmer for the e2e Next.js build cache only; runs on main, no released artifacts are built or published from this cached state
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: pnpm install
      - name: Load default env
        # Same files as e2e-tests: turbo hashes the whole .env.
        run: |
          cp .env.dev.example .env
          cp .env.dev.example web/.env
      - name: Compute web build hash
        # Keys the cache by turbo's web#build hash, so a push that leaves the
        # web build unchanged finds its entry and skips the build.
        id: web-hash
        run: |
          hash="$(pnpm exec turbo run build --filter=web --dry=json | jq -r '.tasks[] | select(.taskId == "web#build") | .hash')"
          if [ -z "$hash" ] || [ "$hash" = "null" ]; then
            echo "Could not read the web#build hash from turbo's dry run"
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Look up Next.js build cache
        # Checks for this exact web build without downloading the archive.
        id: nextjs-cache-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] cache warmer for the e2e Next.js build cache only; runs on main, no released artifacts are built or published from this cached state
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.web-hash.outputs.hash }}
          lookup-only: true
      - name: Restore Next.js build cache
        if: steps.nextjs-cache-lookup.outputs.cache-hit != 'true'
        id: nextjs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] cache warmer for the e2e Next.js build cache only; runs on main, no released artifacts are built or published from this cached state
        with:
          # Path, key and prefix must match the restore steps in pipeline.yml.
          path: web/.next/cache
          key: ${{ steps.nextjs-cache-lookup.outputs.cache-primary-key }}
          # No cross-lockfile fallback: a dependency change starts a fresh
          # cache instead of carrying the old one forward indefinitely.
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Setup Turbo remote cache
        if: steps.nextjs-cache-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          provider: github
          cache-prefix: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-turbo-ci-
          use-relative-cache-path: true
          server-port: "0"
      - name: Build web
        # web runs outside turbo: a turbo cache hit would restore .next
        # without running next build, and leave the Next.js cache untouched.
        if: steps.nextjs-cache-lookup.outputs.cache-hit != 'true'
        run: |
          pnpm turbo run build --filter='web^...'
          pnpm --filter=web run build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
      - name: Save Next.js build cache
        if: steps.nextjs-cache-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] cache warmer for the e2e Next.js build cache only; runs on main, no released artifacts are built or published from this cached state
        with:
          path: web/.next/cache
          key: ${{ steps.nextjs-cache-lookup.outputs.cache-primary-key }}
