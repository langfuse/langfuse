---
name: Check GitHub Actions

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "v3"
  merge_group:
  pull_request:
    branches:
      - "main"
      - "v3"

permissions: {}

# Cancel superseded PR runs; keep other events independent with a unique group per run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  zizmor:
    name: Check GitHub Actions security
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: ${{ github.event_name == 'push' && 'true' || 'false' }}
          min-severity: low
