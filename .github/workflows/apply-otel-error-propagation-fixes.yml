name: Apply OTEL error propagation fixes

on:
  push:
    branches:
      - fix/otel-write-errors

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/otel-write-errors
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          processor = "packages/shared/src/server/otel/OtelIngestionProcessor.ts"

          replace_once(
              processor,
              "return this.processResourceSpan(resourceSpan);",
              "return this.processResourceSpan(resourceSpan, resourceSpans);",
          )

          replace_once(
              processor,
              """          // Log error but don't throw to avoid breaking the ingestion pipeline\n          logger.error(\"Error processing OTEL spans:\", {\n            error,\n            ...this.getConversionFailureLogContext(resourceSpans),\n          });\n          traceException(error, span);\n\n          return [];""",
              """          logger.error(\"Error processing OTEL spans:\", {\n            error,\n            ...this.getConversionFailureLogContext(resourceSpans),\n          });\n          traceException(error, span);\n\n          throw error;""",
          )

          replace_once(
              processor,
              """  private processResourceSpan(\n    resourceSpan: ResourceSpan,\n  ): IngestionEventType[] {""",
              """  private processResourceSpan(\n    resourceSpan: ResourceSpan,\n    resourceSpans: ResourceSpan[] = [resourceSpan],\n  ): IngestionEventType[] {""",
          )

          replace_once(
              processor,
              """        const spanEvents = this.processSpan(\n          span,\n          scopeSpan,\n          resourceAttributes,\n          scopeAttributes,\n          isLangfuseSDKSpans,\n        );\n        events.push(...spanEvents);""",
              """        try {\n          const spanEvents = this.processSpan(\n            span,\n            scopeSpan,\n            resourceAttributes,\n            scopeAttributes,\n            isLangfuseSDKSpans,\n          );\n          events.push(...spanEvents);\n        } catch (error) {\n          if (error instanceof ForbiddenError) {\n            throw error;\n          }\n\n          logger.error(\"Error processing OTEL spans:\", {\n            error,\n            ...this.getConversionFailureLogContext(resourceSpans),\n          });\n          traceException(error);\n        }""",
          )

          replace_once(
              processor,
              """      resourceSpans.forEach((resourceSpan) => {\n        for (const scopeSpan of resourceSpan?.scopeSpans ?? []) {\n          for (const span of scopeSpan?.spans ?? []) {\n            traceIds.add(this.parseId(span.traceId?.data ?? span.traceId));\n          }\n        }\n      });""",
              """      for (const resourceSpan of resourceSpans) {\n        for (const scopeSpan of resourceSpan?.scopeSpans ?? []) {\n          for (const span of scopeSpan?.spans ?? []) {\n            try {\n              traceIds.add(this.parseId(span.traceId?.data ?? span.traceId));\n            } catch (error) {\n              logger.warn(\n                \"Failed to parse traceId in getSeenTracesSet:\",\n                error,\n              );\n            }\n          }\n        }\n      }""",
          )

          replace_once(
              processor,
              """    } catch (error) {\n      // Redis error will be captured by parent span, just log and continue\n      logger.error(\"Redis operation failed in getSeenTracesSet:\", error);\n\n      // Return empty set to continue processing (fail-safe behavior)\n      return new Set();\n    }""",
              """    } catch (error) {\n      logger.error(\"Redis operation failed in getSeenTracesSet:\", error);\n      throw error;\n    }""",
          )

          direct_test = "worker/src/queues/__tests__/otelDirectEventWrite.test.ts"
          p = Path(direct_test)
          text = p.read_text()
          marker = 'describe("direct-v4 trace batch tracking", () => {'
          start = text.index(marker)
          end = text.index('\ndescribe("early media extraction rollout"', start)
          section = text[start:end]
          old = "      await processor(job, undefined);"
          if section.count(old) != 4:
              raise SystemExit(f"Expected 4 processor calls in direct-v4 test, found {section.count(old)}")
          section = section.replace(old, "      await expect(processor(job, undefined)).rejects.toThrow();")
          text = text[:start] + section + text[end:]
          p.write_text(text)

          workflow = Path(".github/workflows/apply-otel-error-propagation-fixes.yml")
          workflow.unlink()

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", processor, direct_test, str(workflow)], check=True)
          subprocess.run(["git", "commit", "-m", "fix(otel): propagate conversion failures"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:fix/otel-write-errors"], check=True)
