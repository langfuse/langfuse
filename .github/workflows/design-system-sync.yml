name: Design System Sync

on:
  # TEMPORARY: test run from PR #18966; remove before merge.
  pull_request:
    types: [synchronize]
  schedule:
    # Daily at 13:12 UTC: 14:12 CET / 15:12 CEST, 05:12 PST / 06:12 PDT.
    - cron: "12 13 * * *"
  workflow_dispatch:
    inputs:
      max_turns:
        description: "Maximum Claude Code agent turns (1-500)"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: design-system-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'langfuse/langfuse' && (github.event_name != 'pull_request' || github.head_ref == 'mark/design-sync-langfuse-75bd0e')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false

      # Shares the pnpm store cache that warm-caches.yml keeps warm on main.
      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] scheduled main-only job; caches are restored from main-scoped entries that PR runs cannot write
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] scheduled main-only job; caches are restored from main-scoped entries that PR runs cannot write
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Validate inputs
        id: validate-inputs
        env:
          MAX_TURNS: ${{ github.event.inputs.max_turns || '300' }}
        run: |
          set -euo pipefail
          if ! [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || [ "$MAX_TURNS" -lt 1 ] || [ "$MAX_TURNS" -gt 500 ]; then
            echo "::error::max_turns must be a whole number from 1 to 500"
            exit 1
          fi
          echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"

      - name: Sync design system
        id: claude-sync
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        env:
          API_TIMEOUT_MS: "900000"
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
        with:
          # Uploads go through a claude.ai login, which an API key does not carry.
          claude_code_oauth_token: ${{ secrets.CLAUDE_DESIGN_SYNC_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          display_report: "true"
          prompt: |
            You are running Langfuse's scheduled design-system sync. Run /design-sync to
            re-sync the design system to the Claude Design project pinned in
            .design-sync/config.json, following .design-sync/NOTES.md.

            This run is unattended:
            - Never ask questions. When a step needs a human decision, stop without
              uploading and report what is blocked.
            - Sync only to the pinned projectId. Never create, re-adopt or switch projects.
            - Build Storybook only with the committed .env.dev.example, never a .env file.
            - Upload only components whose previews pass verification. Report any
              component that fails, with its grade notes, instead of uploading it.
            - When the sync needs a repo change (a new shared app component in
              .design-sync/ds-package/gen-entry.sh, a config.json fix, a NOTES.md
              correction), edit files under .design-sync/ only. Never edit anything
              else. Do not commit, push or open pull requests; the workflow opens
              and auto-merges a PR for any .design-sync/ change.
            - If nothing changed since the last sync, say so and stop.

            End with a short summary: components uploaded, deleted, failed or skipped,
            and any .design-sync/ files you changed and why.
          claude_args: |
            --model claude-opus-5-5
            --max-turns ${{ steps.validate-inputs.outputs.max_turns }}
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,Bash,DesignSync"

      # The action hides Claude's output; surface only the final result message.
      - name: Show Claude error
        if: failure() && steps.claude-sync.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude-sync.outputs.execution_file }}
        run: |
          if [ -s "$EXECUTION_FILE" ]; then
            jq -r '.[] | select(.type == "result") | .result // empty' "$EXECUTION_FILE" | head -c 4000
          fi

      - name: Prepare pull request patch
        id: prepare
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No repository changes after the sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          allowed_file_regex='^\.design-sync/'
          for changed_file in "${changed_files[@]}"; do
            if [[ ! "$changed_file" =~ $allowed_file_regex ]]; then
              echo "::error::The sync changed a file outside .design-sync/: $changed_file"
              exit 1
            fi
          done

          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null git -c core.hooksPath=/dev/null add -- "${changed_files[@]}"
          git diff --cached --check

          git config user.name "langfuse-bot"
          git config user.email "langfuse-bot@langfuse.com"
          git -c core.hooksPath=/dev/null commit --no-verify -q -m "chore(design-sync): apply fixes from the daily design-system sync"
          git format-patch -1 --stdout HEAD > "$RUNNER_TEMP/design-system-sync.patch"

          {
            echo "## Summary"
            echo "The daily design-system sync needed changes under \`.design-sync/\` to keep the Claude Design project in step with Storybook."
            echo
            echo "See the [sync run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for what changed and why."
            echo
            echo '```text'
            git diff --stat HEAD^ HEAD
            echo '```'
          } > "$RUNNER_TEMP/design-system-sync-pr-body.md"

          {
            echo "## Design-sync changes"
            echo
            echo '```text'
            git diff --stat HEAD^ HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload pull request patch
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-system-sync-pr
          path: |
            ${{ runner.temp }}/design-system-sync.patch
            ${{ runner.temp }}/design-system-sync-pr-body.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BOT_BRANCH: design-system-sync-bot
    steps:
      - name: Download pull request patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: design-system-sync-pr
          path: ${{ runner.temp }}/design-system-sync-pr

      # A PAT, not GITHUB_TOKEN, so the PR runs CI and can auto-merge.
      - name: Push branch, open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PATCH_PATH="$RUNNER_TEMP/design-system-sync-pr/design-system-sync.patch"
          BODY_PATH="$RUNNER_TEMP/design-system-sync-pr/design-system-sync-pr-body.md"
          PUSH_REPO="$RUNNER_TEMP/push-design-system-sync"

          mkdir -p "$PUSH_REPO"
          git -C "$PUSH_REPO" init -q
          git -C "$PUSH_REPO" fetch --no-tags --depth=100 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF"
          git -C "$PUSH_REPO" checkout -q -b "$BOT_BRANCH" "$GITHUB_SHA"
          git -C "$PUSH_REPO" config user.name "langfuse-bot"
          git -C "$PUSH_REPO" config user.email "langfuse-bot@langfuse.com"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null git \
            -C "$PUSH_REPO" \
            -c core.hooksPath=/dev/null \
            am --3way "$PATCH_PATH"

          mapfile -t applied_files < <(git -C "$PUSH_REPO" diff-tree --no-commit-id --name-only -r HEAD)
          for applied_file in "${applied_files[@]}"; do
            if [[ ! "$applied_file" =~ ^\.design-sync/ ]]; then
              echo "::error::Refusing to push a patch that changes a file outside .design-sync/: $applied_file"
              exit 1
            fi
          done

          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null git \
            -C "$PUSH_REPO" \
            -c credential.helper= \
            -c credential.https://github.com.helper= \
            -c core.hooksPath=/dev/null \
            push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BOT_BRANCH"

          PR_TITLE="$(git -C "$PUSH_REPO" log -1 --format=%s)"
          pr_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BOT_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"
          if [ -n "$pr_url" ]; then
            gh pr edit --repo "$GITHUB_REPOSITORY" "$pr_url" --title "$PR_TITLE" --body-file "$BODY_PATH"
          else
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head "$BOT_BRANCH" \
                --base main \
                --title "$PR_TITLE" \
                --body-file "$BODY_PATH"
            )"
          fi

          if ! gh pr merge --repo "$GITHUB_REPOSITORY" "$pr_url" --auto --squash; then
            echo "::warning::Could not enable auto-merge on $pr_url; it needs a manual merge."
          fi

          echo "Design-sync PR: $pr_url"
          {
            echo "## Pull request"
            echo "$pr_url"
          } >> "$GITHUB_STEP_SUMMARY"
