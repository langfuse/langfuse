name: Label PRs with conflicts

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  pull-requests: read
  issues: write

jobs:
  label-prs-with-conflicts:
    runs-on: ubuntu-latest
    # Only run pull_request events for same-repo PRs to avoid permission issues with forks.
    # Fork PRs are intentionally not labeled by this workflow.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check mergeability and update label
        env:
          # Requires Issues: read/write and Pull requests: read-only.
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: has-conflicts
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh_api() {
            local response

            if response=$(gh api "$@" 2>&1); then
              printf '%s\n' "${response}"
              return 0
            fi

            if grep -Eqi 'rate limit exceeded|secondary rate limit' <<<"${response}"; then
              return 2
            fi

            printf '%s\n' "${response}" >&2
            return 1
          }

          update_label_if_needed() {
            local pr_number="$1"
            local remove_stale_label="${2:-false}"

            get_mergeable() {
              local pr_number="$1"
              local response
              local mergeable

              if response=$(gh_api "repos/${REPO}/pulls/${pr_number}"); then
                :
              else
                status=$?
                if [ "${status}" -eq 2 ]; then
                  return 2
                fi
                echo "::warning::PR #${pr_number}: failed to fetch mergeability" >&2
                return 1
              fi

              if ! mergeable=$(jq -r '
                if .mergeable == false or .mergeable_state == "dirty" then "false"
                elif .mergeable == true then "true"
                else "unknown"
                end
              ' <<<"${response}" 2>&1); then
                response="${response//$'\n'/ }"
                mergeable="${mergeable//$'\n'/ }"
                echo "::warning::PR #${pr_number}: failed to parse mergeability: ${mergeable}; response: ${response}" >&2
                return 1
              fi

              printf '%s\n' "${mergeable}"
            }

            if mergeable=$(get_mergeable "${pr_number}"); then
              :
            else
              return $?
            fi

            for delay in 3 6; do
              if [ "${mergeable}" != "unknown" ]; then
                break
              fi

              sleep "${delay}"
              if mergeable=$(get_mergeable "${pr_number}"); then
                :
              else
                return $?
              fi
            done

            echo "PR #${pr_number}: mergeable=${mergeable}"

            if [ "${mergeable}" = "unknown" ]; then
              echo "::warning::PR #${pr_number}: mergeability was not computed after retries"
              return 1
            fi

            if [ "${mergeable}" = "false" ]; then
              if gh_api \
                --method POST \
                "repos/${REPO}/issues/${pr_number}/labels" \
                -f "labels[]=${LABEL_NAME}"; then
                :
              else
                status=$?
                if [ "${status}" -eq 2 ]; then
                  return 2
                fi
                echo "::warning::PR #${pr_number}: failed to add ${LABEL_NAME} label" >&2
                return 1
              fi
            elif [ "${mergeable}" = "true" ] && [ "${remove_stale_label}" = "true" ]; then
              gh_api \
                --method DELETE \
                "repos/${REPO}/issues/${pr_number}/labels/${LABEL_NAME}" \
                --silent || true
            fi
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            update_label_if_needed "${PR_NUMBER}" true || [ "$?" -eq 2 ]
          else
            sleep 10
            cutoff_date=$(date -u -d "14 days ago" +%F)
            # On main pushes, only scan same-repo PRs that are not already labeled.
            # Stale has-conflicts labels are intentionally removed only on PR updates.
            if prs=$(gh_api --paginate "search/issues?q=repo:${REPO}+is:pr+is:open+-label:${LABEL_NAME}+updated:>=${cutoff_date}&per_page=100" --jq '.items[].number'); then
              while read -r pr; do
                [ -n "${pr}" ] || continue
                if head_repo=$(gh_api "repos/${REPO}/pulls/${pr}" --jq '.head.repo.full_name'); then
                  :
                elif [ "$?" -eq 2 ]; then
                  break
                else
                  continue
                fi
                if [ "${head_repo}" != "${REPO}" ]; then
                  continue
                fi
                if update_label_if_needed "${pr}"; then
                  :
                elif [ "$?" -eq 2 ]; then
                  break
                fi
              done <<<"${prs}"
            elif [ "$?" -ne 2 ]; then
              exit 1
            fi
          fi
