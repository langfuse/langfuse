name: License Compliance Check
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  merge_group:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  checks: write # Needed to create a check run for the license compliance check results

jobs:
  license_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Generate production dependency license report
        run: |
          pnpm -r licenses list --prod --json > pnpm-licenses.json
          # Exempt only these package versions; upgrades receive a fresh license check.
          jq -er '
            ["axe-core@4.13.0", "dompurify@3.4.16", "elkjs@0.11.1"] as $exceptions |
            if length == 0 then error("No production dependency licenses found")
            else ["package_name", "license_name"],
              (to_entries[] | .key as $license | .value[] | .name as $name |
                .versions[] | "\($name)@\(.)" as $package |
                select($exceptions | index($package) | not) | [$package, $license])
            end | @csv
          ' pnpm-licenses.json > pnpm-licenses.csv

      - name: Check production dependency licenses
        id: license_check_report
        uses: pilosus/action-pip-license-checker@e909b0226ff49d3235c99c4585bc617f49fff16a # v3.1.0
        with:
          external: "pnpm-licenses.csv"
          external-format: "csv"
          external-options: "{:skip-header true}"
          fail: "WeakCopyleft,StrongCopyleft,NetworkCopyleft"
          fails-only: true
          totals: true
          verbose: 1
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Echo error
        if: failure()
        run: echo "::error::${STEPS_LICENSE_CHECK_REPORT_OUTPUTS_REPORT}"
        env:
          STEPS_LICENSE_CHECK_REPORT_OUTPUTS_REPORT: ${{ steps.license_check_report.outputs.report }}
