name: Backfill preview AI gateway images

# One-shot. Previews that were already deployed when the AI gateway chart
# landed ask for langfuse-preview-ai-gateway:pr-<n>-<sha>, but that tag was
# never built. Gateway sources have not changed since those commits, so this
# copies one image that is already running onto those tags.
#
# The ECR push role only trusts pull_request runs (ref refs/pull/*), which is
# why this is a pull_request workflow rather than workflow_dispatch. It runs
# only for this branch. Close the PR after the job succeeds. Do not merge it.
on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  backfill:
    name: Copy gateway image onto missing tags
    if: github.head_ref == 'preview-gateway-image-backfill'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_PREVIEW_REGION }}
          role-to-assume: ${{ vars.AWS_PREVIEW_ECR_PUSH_ROLE_ARN }}

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Copy the running gateway image onto the missing tags
        env:
          SOURCE: 044014415108.dkr.ecr.eu-west-1.amazonaws.com/langfuse-preview-ai-gateway:pr-18719-dfe0f7068d975947f77024a3b605b36b14e4494e
        run: |
          set -euo pipefail
          repo="${SOURCE%:*}"
          repo_name="${repo##*/}"
          docker pull "${SOURCE}"

          copy_tag() {
            local tag="$1"
            local dest="${repo}:${tag}"
            local describe_out
            if describe_out="$(aws ecr describe-images --repository-name "${repo_name}" \
                  --image-ids "imageTag=${tag}" 2>&1)"; then
              echo "${dest} already present — skipping."
              return 0
            fi
            if ! grep -q 'ImageNotFoundException' <<<"${describe_out}"; then
              echo "::error::Cannot confirm ${dest} in ECR — ${describe_out}"
              return 1
            fi
            docker tag "${SOURCE}" "${dest}"
            docker push "${dest}"
            echo "pushed ${dest}"
          }

          copy_tag pr-18417-7a4a3194c7f5c9ab7fa4811cb87cb5d37086b29b
          copy_tag pr-18418-1e4ade0865461b957587dcb6c799cc6ba5ab5754
          copy_tag pr-18448-949eca46a85edb9e6e46a61ff2dc517384baf3f5
