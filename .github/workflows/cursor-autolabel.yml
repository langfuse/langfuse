name: Cursor auto-label

# Apply the `cursor` GitHub label to same-repo PRs opened by a Cursor agent.
# Detection is author, branch prefix, or Cursor Cloud PR-body markers — not a
# human allowlist. Fork PRs are skipped (same boundary as preview-autolabel).
#
# Uses the plain `pull_request` trigger (NOT pull_request_target): no cloud
# credentials, no checkout, no PR-code execution — only GitHub API calls.
# Including synchronize recovers PRs that opened with merge conflicts: GitHub
# skips pull_request workflows until the conflict is resolved.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  cursor-label:
    name: Auto-label Cursor PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label Cursor PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = "cursor";
            const COLOR = "ededed";
            const DESCRIPTION = "Opened by a Cursor agent";

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info("Fork or missing head repo; auto-label is limited to same-repo branches.");
              return;
            }

            const login = (pr.user?.login || "").toLowerCase();
            const isCursorAuthor =
              login === "cursor[bot]" ||
              login === "app/cursor" ||
              login === "cursor" ||
              (login.includes("cursor") && login.endsWith("[bot]"));
            const isCursorBranch = (pr.head?.ref || "").startsWith("cursor/");
            const body = pr.body || "";
            const hasCursorBody =
              body.includes("CURSOR_AGENT_PR_BODY") ||
              body.includes("cursor.com/agents/");

            if (!isCursorAuthor && !isCursorBranch && !hasCursorBody) {
              core.info(
                `PR #${pr.number} is not a Cursor PR (author=${pr.user?.login}, branch=${pr.head?.ref}).`,
              );
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: COLOR,
                  description: DESCRIPTION,
                });
                core.info(`Created missing '${LABEL}' label.`);
              } catch (createError) {
                if (createError.status !== 422) {
                  throw createError;
                }
                await github.rest.issues.getLabel({ owner, repo, name: LABEL });
                core.info(`'${LABEL}' label appeared concurrently; continuing.`);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: [LABEL],
            });
            core.info(`Applied '${LABEL}' label to PR #${pr.number}.`);
