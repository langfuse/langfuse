---
name: "Validate PR Title"

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - edited
      - synchronize
      - reopened

# Cancel superseded PR runs; keep other events independent with a unique group per run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Validate PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure the types of commits allowed
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          # Allow scopes (optional)
          requireScope: false
          # Allow any scope (not just the ones listed above)
          validateSingleCommit: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
