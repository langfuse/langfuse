version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"

  - package-ecosystem: cargo
    directory: "/ai-gateway"
    assignees:
      - "hassiebp"
      - "wochinge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Dependabot resolves without the clickhouse overlay from
  # packages/native/scripts/prepare-clickhouse-rs.sh, so its Cargo.lock adds
  # `source` and `checksum` lines to the `clickhouse` entry. Drop those two
  # lines before merging, or CI's `--locked` builds reject the lockfile.
  - package-ecosystem: cargo
    directory: "/packages/native"
    assignees:
      - "sumerman"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"
