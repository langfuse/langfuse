name: Setup pnpm
description: >-
  Installs pnpm with pnpm/setup and retries once. pnpm/setup downloads the
  pnpm executable from the npm registry in every job, so a registry hiccup
  would otherwise fail the job before it does anything.

runs:
  using: composite
  steps:
    - id: setup
      continue-on-error: true
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: false
        cache: false
    - name: Wait before retrying pnpm setup
      if: steps.setup.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=pnpm download failed::Retrying pnpm/setup after 10s"
        sleep 10
    - name: Retry pnpm setup
      if: steps.setup.outcome == 'failure'
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: false
        cache: false
