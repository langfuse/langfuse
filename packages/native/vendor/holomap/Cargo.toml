# holomap 0.3.1 from crates.io (https://github.com/mnmal-ai/holomap), vendored
# so both Topics reductions can share one neighbour graph. Local changes:
# `NeighborGraph` in src/api.rs; the fixture parity tests are dropped.
[package]
name = "holomap"
version = "0.3.1"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mnmal-ai/holomap"

[dependencies]
libm = "0.2.16"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
ndarray = { version = "0.17", optional = true }
rand = { version = "0.10", default-features = false }
rand_pcg = "0.10"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]
ndarray = ["dep:ndarray"]
