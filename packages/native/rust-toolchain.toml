# Same Rust version as ai-gateway/rust-toolchain.toml so the repository starts
# out on one compiler; the two files stay separate so either crate can move on
# its own. worker/Dockerfile copies this exact version from the official
# `rust:<version>-alpine` image, so bump the two together.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
