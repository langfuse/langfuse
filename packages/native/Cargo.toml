[package]
name = "langfuse-native"
version = "0.0.0"
edition = "2021"
# napi-rs 3 needs at least Rust 1.88.
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clickhouse = { version = "=0.15.2", default-features = false }
clickhouse-types = "=0.1.3"
metrics = "0.24"
metrics-exporter-dogstatsd = "0.9"
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
rust_decimal = { version = "1.37.2", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
