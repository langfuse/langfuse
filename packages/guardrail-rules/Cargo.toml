[package]
name = "guardrail-rules"
version = "0.1.0"
edition = "2024"
publish = false

# Built as an `rlib` for the gateway (`compile`) and as a WebAssembly `cdylib`
# for the control plane (`validate`). Regex versions are pinned to
# ai-gateway/Cargo.lock so both sides accept and reject the same rules.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "perf", "meta", "nfa", "hybrid", "dfa-onepass"] }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact, so the generated glue matches the wasm-bindgen CLI pinned in scripts/build-wasm.sh.
wasm-bindgen = { version = "=0.2.130", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Keeps pkg/ byte-identical across machines: no debug info, which carries
# build paths (scripts/build-wasm.sh remaps the rest).
debug = false
panic = "abort"
