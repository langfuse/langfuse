types:
  # to be used as copy/paste template for query strings
  # PaginationRequest:
  #   properties:
  #     page:
  #       type: optional<integer>
  #       docs: page number, starts at 1
  #     limit:
  #       type: optional<integer>
  #       docs: limit of items per page
  MetaResponse:
    properties:
      deprecation:
        type: optional<MetaDeprecation>
        docs: Set on list responses of deprecated endpoints.
      page:
        type: integer
        docs: current page number
      limit:
        type: integer
        docs: number of items per page
      totalItems:
        type: integer
        docs: number of total items given the current filters/selection (if any)
      totalPages:
        type: integer
        docs: number of total pages given the current limit
  MetaDeprecation:
    docs: Short deprecation signal next to the pagination fields. The full signal is the top-level `_deprecation` key.
    properties:
      sunsetAt:
        type: optional<string>
        docs: ISO date after which the endpoint may stop working, when a removal date is committed.
      replacement:
        type: optional<string>
        docs: The replacement endpoint, e.g. "GET /api/public/v2/observations".
  CursorMetaResponse:
    docs: Metadata for cursor-based pagination.
    properties:
      cursor:
        type: optional<string>
        docs: Opaque cursor for the next page. Omitted when there is no next page.
