# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  commons: ./commons.yml
  pagination: ./utils/pagination.yml

service:
  auth: true
  base-path: /api/public
  endpoints:
    getOrganizationMemberships:
      docs: Get all memberships for the organization associated with the API key (requires organization-scoped API key)
      method: GET
      path: /organizations/memberships
      response: MembershipsResponse

    updateOrganizationMembership:
      docs: Create or update a membership for the organization associated with the API key (requires organization-scoped API key)
      method: PUT
      path: /organizations/memberships
      request: MembershipRequest
      response: MembershipResponse

    deleteOrganizationMembership:
      docs: Delete a membership from the organization associated with the API key (requires organization-scoped API key)
      method: DELETE
      path: /organizations/memberships
      request: DeleteMembershipRequest
      response: MembershipDeletionResponse

    getOrganizationMembershipUserProjects:
      docs: |
        Get the projects a user of the organization associated with the API key has access to, including the access level per project (requires organization-scoped API key).

        Tenant-scoped: results cover only the API key's own organization. For a cross-organization view of the organizations a user belongs to, use the admin API `GET /api/admin/users/{email}/organizations`.

        The email must be URL-encoded (e.g. `jane%40example.com`) and the lookup is case-insensitive. An explicit project role overrides the organization role; projects the user has no access to are omitted. Returns a 404 if the user is not a member of the organization.
      method: GET
      path: /organizations/memberships/{email}
      path-parameters:
        email:
          type: string
          docs: URL-encoded email address of the user (lookup is case-insensitive)
      response: UserProjectAccessResponse

    getProjectMemberships:
      docs: Get all memberships for a specific project (requires organization-scoped API key)
      method: GET
      path: /projects/{projectId}/memberships
      path-parameters:
        projectId: string
      response: MembershipsResponse

    updateProjectMembership:
      docs: Create or update a membership for a specific project (requires organization-scoped API key). The user must already be a member of the organization.
      method: PUT
      path: /projects/{projectId}/memberships
      path-parameters:
        projectId: string
      request: MembershipRequest
      response: MembershipResponse

    deleteProjectMembership:
      docs: Delete a membership from a specific project (requires organization-scoped API key). The user must be a member of the organization.
      method: DELETE
      path: /projects/{projectId}/memberships
      path-parameters:
        projectId: string
      request: DeleteMembershipRequest
      response: MembershipDeletionResponse

    getOrganizationProjects:
      docs: Get all projects for the organization associated with the API key (requires organization-scoped API key)
      method: GET
      path: /organizations/projects
      response: OrganizationProjectsResponse

    getOrganizationApiKeys:
      docs: Get all API keys for the organization associated with the API key (requires organization-scoped API key)
      method: GET
      path: /organizations/apiKeys
      response: OrganizationApiKeysResponse

types:
  MembershipRole:
    enum:
      - OWNER
      - ADMIN
      - MEMBER
      - VIEWER

  MembershipRequest:
    properties:
      userId: string
      role: MembershipRole

  DeleteMembershipRequest:
    properties:
      userId: string

  MembershipResponse:
    properties:
      userId: string
      role: MembershipRole
      email: string
      name: string

  MembershipDeletionResponse:
    properties:
      message: string
      userId: string

  MembershipsResponse:
    properties:
      memberships: list<MembershipResponse>

  OrganizationAccessLevel:
    docs: |
      Access level of a user within an organization. `NONE` means the user is a member of the
      organization without default access to its projects, and only reaches projects for which
      an explicit project role is set.
    enum:
      - OWNER
      - ADMIN
      - MEMBER
      - VIEWER
      - NONE

  UserProjectAccess:
    properties:
      projectId: string
      name: string
      role:
        type: MembershipRole
        docs: Effective access level of the user for this project
      inheritedFromOrgRole:
        type: boolean
        docs: True if the access level is inherited from the organization role, false if an explicit project role is set

  UserProjectAccessResponse:
    properties:
      userId: string
      email: string
      name: optional<string>
      orgRole: OrganizationAccessLevel
      projects: list<UserProjectAccess>

  OrganizationProject:
    properties:
      id: string
      name: string
      metadata: optional<map<string, unknown>>
      createdAt: datetime
      updatedAt: datetime

  OrganizationProjectsResponse:
    properties:
      projects: list<OrganizationProject>

  OrganizationApiKey:
    properties:
      id: string
      createdAt: datetime
      expiresAt: optional<datetime>
      lastUsedAt: optional<datetime>
      note: optional<string>
      publicKey: string
      displaySecretKey: string

  OrganizationApiKeysResponse:
    properties:
      apiKeys: list<OrganizationApiKey>
