# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
service:
  auth: true
  base-path: /api/public/integrations/pagerduty
  endpoints:
    getPagerDutyIntegrations:
      docs: Get all PagerDuty routing keys of the project. Raw routing keys are never returned.
      method: GET
      path: ""
      response: PagerDutyIntegrationsResponse

    createPagerDutyIntegration:
      docs: Store a PagerDuty routing key (a service integration key or an Event Orchestration key) under a project-unique name. Automations send monitor alerts, project notifications and prompt changes to it.
      method: POST
      path: ""
      request: CreatePagerDutyIntegrationRequest
      response:
        status-code: 201
        type: PagerDutyIntegration

    updatePagerDutyIntegration:
      docs: Rename a PagerDuty routing key, rotate it, or change its region.
      method: PATCH
      path: "/{id}"
      path-parameters:
        id: string
      request: UpdatePagerDutyIntegrationRequest
      response: PagerDutyIntegration

    deletePagerDutyIntegration:
      docs: Delete a PagerDuty routing key. Returns 409 with the automations that still send to it.
      method: DELETE
      path: "/{id}"
      path-parameters:
        id: string
      response: PagerDutyIntegrationDeletionResponse
      errors:
        - PagerDutyIntegrationInUseError

types:
  PagerDutyRegion:
    docs: Service region of the PagerDuty account. Selects events.pagerduty.com (US) or events.eu.pagerduty.com (EU).
    enum:
      - US
      - EU

  PagerDutyIntegration:
    properties:
      id: string
      name:
        type: string
        docs: Name of the routing key, unique within the project
      displayRoutingKey:
        type: string
        docs: Masked routing key for display, e.g. `R0ab...9xYz`
      region: PagerDutyRegion

  PagerDutyIntegrationsResponse:
    properties:
      data: list<PagerDutyIntegration>

  CreatePagerDutyIntegrationRequest:
    properties:
      name:
        type: string
        docs: Name of the routing key, unique within the project (1-100 characters)
      routingKey:
        type: string
        docs: The 32-character integration key from PagerDuty. Stored encrypted and never returned.
      region:
        type: optional<PagerDutyRegion>
        docs: Defaults to US

  UpdatePagerDutyIntegrationRequest:
    properties:
      name:
        type: optional<string>
        docs: New name, unique within the project (1-100 characters)
      routingKey:
        type: optional<string>
        docs: New 32-character integration key from PagerDuty
      region: optional<PagerDutyRegion>

  PagerDutyIntegrationDeletionResponse:
    properties:
      message: string

  PagerDutyIntegrationUsage:
    properties:
      id: string
      name: string

  PagerDutyIntegrationInUseResponse:
    properties:
      message: string
      error: string
      automations:
        type: list<PagerDutyIntegrationUsage>
        docs: Automations that still send to the routing key

errors:
  PagerDutyIntegrationInUseError:
    docs: The routing key is still used by automations.
    status-code: 409
    type: PagerDutyIntegrationInUseResponse
