# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  commons: ./commons.yml
  pagination: ./utils/pagination.yml
service:
  auth: true
  base-path: /api/public
  endpoints:
    list:
      method: GET
      docs: Get all LLM connections in a project
      path: /llm-connections
      request:
        name: GetLlmConnectionsRequest
        query-parameters:
          page:
            type: optional<integer>
            docs: page number, starts at 1
          limit:
            type: optional<integer>
            docs: limit of items per page
      response: PaginatedLlmConnections
    upsert:
      method: PUT
      docs: Create or update an LLM connection. The connection is upserted on provider.
      path: /llm-connections
      request: UpsertLlmConnectionRequest
      response: LlmConnection
    delete:
      method: DELETE
      docs: Delete an LLM connection by id. Evaluators that depend on the deleted connection are automatically paused.
      path: /llm-connections/{id}
      path-parameters:
        id: string
      response: DeleteLlmConnectionResponse
    listOrganization:
      method: GET
      docs: Get all organization-level LLM connections. Requires an organization-scoped API key.
      path: /organizations/llm-connections
      request:
        name: GetOrganizationLlmConnectionsRequest
        query-parameters:
          page:
            type: optional<integer>
            docs: page number, starts at 1
          limit:
            type: optional<integer>
            docs: limit of items per page
      response: PaginatedLlmConnections
    upsertOrganization:
      method: PUT
      docs: Create or update an organization-level LLM connection. The connection is upserted on provider and inherited by projects without a provider override. Requires an organization-scoped API key.
      path: /organizations/llm-connections
      request: UpsertLlmConnectionRequest
      response: LlmConnection
    deleteOrganization:
      method: DELETE
      docs: Delete an organization-level LLM connection by id. Evaluators in projects without an override for the provider are automatically paused. Requires an organization-scoped API key.
      path: /organizations/llm-connections/{id}
      path-parameters:
        id: string
      response: DeleteLlmConnectionResponse

types:
  LlmConnection:
    docs: LLM API connection configuration (secrets excluded)
    properties:
      id: string
      provider:
        type: string
        docs: Provider name (e.g., 'openai', 'my-gateway'). Must be unique in project, used for upserting.
      adapter:
        type: string
        docs: The adapter used to interface with the LLM
      displaySecretKey:
        type: string
        docs: >
          Masked version of the secret key for display purposes. For an OAuth2
          connection using `private_key_jwt`, this is `kid:<kid>` taken from the
          private JWK (`kid:none` if the JWK has no `kid`); the key itself is never
          returned.
      baseURL:
        type: optional<string>
        docs: Custom base URL for the LLM API
      customModels:
        type: list<string>
        docs: List of custom model names available for this connection
      withDefaultModels:
        type: boolean
        docs: Whether to include default models for this adapter
      extraHeaderKeys:
        type: list<string>
        docs: Keys of extra headers sent with requests (values excluded for security)
      config:
        type: optional<map<string, unknown>>
        docs: >
          Adapter-specific configuration. Required for Bedrock
          (`{"region":"us-east-1"}`), optional for OpenAI (`{"useResponsesApi":true}`
          and/or `{"oauth2":{...}}`), optional for Anthropic (`{"oauth2":{...}}`),
          optional for VertexAI (`{"location":"us-central1"}`), not used by other
          adapters. When set, `oauth2` is returned exactly as configured; it never
          contains a secret.
      createdAt: datetime
      updatedAt: datetime

  PaginatedLlmConnections:
    properties:
      data: list<LlmConnection>
      meta: pagination.MetaResponse

  UpsertLlmConnectionRequest:
    docs: Request to create or update an LLM connection (upsert)
    properties:
      provider:
        type: string
        docs: Provider name (e.g., 'openai', 'my-gateway'). Must be unique in project, used for upserting.
      adapter:
        type: LlmAdapter
        docs: The adapter used to interface with the LLM
      secretKey:
        type: string
        docs: >
          Secret key for the LLM API. For an OAuth2 connection (`config.oauth2` set),
          this is the client secret for `client_secret_basic` / `client_secret_post` /
          `client_secret_jwt`, or a single private JWK as a JSON string (e.g.
          `"{\"kty\":\"RSA\",\"d\":\"...\",...}"`, not a JWKS `{"keys":[...]}`) for
          `private_key_jwt`. Never returned by GET.
      baseURL:
        type: optional<string>
        docs: Custom base URL for the LLM API
      customModels:
        type: optional<list<string>>
        docs: List of custom model names
      withDefaultModels:
        type: optional<boolean>
        docs: Whether to include default models. Default is true.
      extraHeaders:
        type: optional<map<string, string>>
        docs: Extra headers to send with requests
      config:
        type: optional<map<string, unknown>>
        docs: |
          Adapter-specific configuration. Validation rules:

          - **Bedrock**: Required. Must be `{"region": "<aws-region>"}` (e.g., `{"region":"us-east-1"}`)
          - **OpenAI**: Optional. `{"useResponsesApi": <boolean>}` controls whether Langfuse routes calls through OpenAI's Responses API, and/or `{"oauth2": {...}}` (see below).
          - **Anthropic**: Optional. `{"oauth2": {...}}` only (see below).
          - **VertexAI**: Optional. If provided, must be `{"location": "<gcp-location>"}` (e.g., `{"location":"us-central1"}`)
          - **Other adapters**: Not supported. Omit this field or set to null.

          **`oauth2` (OpenAI and Anthropic only)**: machine-to-machine client credentials auth instead of a static API key. Langfuse fetches and caches an access token from the identity provider's token endpoint and sends it as a bearer token, refreshing on expiry or a 401. All shapes share `clientId` (string) and `authMethod`, and accept an optional `assertionAlgorithm` (only with `client_secret_jwt` / `private_key_jwt`). `provider` selects the preset and its fixed token endpoint, or `custom` for any other identity provider:

          - `entra` (Microsoft Entra ID) — `tenantId`, `scope`. Methods: `client_secret_post` (UI default), `client_secret_basic`, `private_key_jwt`.
          - `okta` — `domain`, `authorizationServerId` (optional, default `default`), `scope`. Methods: `client_secret_basic` (UI default), `client_secret_post`, `client_secret_jwt`, `private_key_jwt`.
          - `auth0` — `domain`, `audience`. Methods: `client_secret_post` (UI default), `client_secret_basic`, `private_key_jwt`.
          - `cognito` (Amazon Cognito) — `domain`, `scope` (optional). Methods: `client_secret_basic` (UI default), `client_secret_post`.
          - `keycloak` — `baseUrl`, `realm`, `scope` (optional). Methods: `client_secret_basic` (UI default), `client_secret_post`, `client_secret_jwt`, `private_key_jwt`.
          - `onelogin` — `subdomain`, `scope` (optional), `resource` (optional). Methods: `client_secret_basic` (UI default), `client_secret_post`.
          - `workos` — `domain` (AuthKit domain), `scope` (optional). Methods: `client_secret_post` only.
          - `authentik` — `baseUrl`, `scope` (optional). Methods: `client_secret_post` only.
          - `custom` (any other identity provider) — `tokenEndpoint`, plus optional `scope`, `audience`, `resource`, `assertionAudience` (defaults to `tokenEndpoint`), `sendClientIdWithAssertion` (default `false`). Methods: all four, default `client_secret_basic`.

          The operator must add the resolved token endpoint to the `LANGFUSE_LLM_OAUTH2_ALLOWED_TOKEN_ENDPOINTS` environment variable (exact URL, comma-separated list) or the request is rejected.
    examples:
      - name: OAuth2ClientCredentials
        value:
          provider: my-genai-gateway
          adapter: openai
          baseURL: https://genai.example.com/v1
          secretKey: '{"kty":"RSA","kid":"agent-x-2026","n":"...","e":"...","d":"..."}'
          config:
            oauth2:
              provider: custom
              tokenEndpoint: https://idp.example.com/as/token.oauth2
              clientId: agent-x
              authMethod: private_key_jwt

  DeleteLlmConnectionResponse:
    properties:
      message: string

  LlmAdapter:
    enum:
      - value: anthropic
        name: Anthropic
      - value: openai
        name: OpenAI
      - value: azure
        name: Azure
      - value: bedrock
        name: Bedrock
      - value: google-vertex-ai
        name: GoogleVertexAI
      - value: google-ai-studio
        name: GoogleAIStudio
