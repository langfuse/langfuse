# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  errors: ./errors.yml
  pagination: ../utils/pagination.yml
  dashboardWidgets: ./dashboard-widgets.yml

service:
  auth: true
  base-path: /api/public/unstable
  endpoints:
    list:
      docs: |
        List dashboards in the project, ordered by most recently updated
        first.
      method: GET
      path: /dashboards
      request:
        name: ListDashboardsRequest
        query-parameters:
          page:
            type: optional<integer>
            docs: 1-based page number. Defaults to `1`.
          limit:
            type: optional<integer>
            docs: Maximum number of items per page. Defaults to `50`.
      response: DashboardList
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    create:
      docs: |
        Create a dashboard from a legacy `widgets` definition or a version 1
        `blocks` definition. Project API credentials can create classic widget
        and preset placements. Creating inline Markdown or multi-query widgets
        requires the employee feature preview in the application; public API
        credentials cannot create them.
      method: POST
      path: /dashboards
      request: CreateDashboardRequest
      response: Dashboard
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    get:
      docs: |
        Get a dashboard by id, including supported inline Markdown and
        multi-query widgets. Classic and version 1 definitions return version 1
        with a deprecated `widgets` mirror. If the stored root format is newer
        than this server supports, only its legacy `widgets` projection is
        returned; the server does not label that projection version 1.
      method: GET
      path: /dashboards/{dashboardId}
      path-parameters:
        dashboardId: string
      response: Dashboard
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    update:
      docs: |
        Update a dashboard's name, description, definition, or filters.

        A legacy `widgets` definition updates classic placements while
        preserving inline widgets. A version 1 definition uses `blocks` as the
        complete supported layout; `widgets` may be omitted or must match the
        classic placements in `blocks`.

        Project API credentials may round-trip existing inline widgets unchanged
        while editing classic placements. Creating, editing, removing,
        reordering, or submitting a stale revision of an inline widget returns
        `403`. Use the application's employee feature preview to change inline
        content. Unsupported future entries are preserved in storage, and
        definitions with an unsupported root version cannot be edited.
      method: PATCH
      path: /dashboards/{dashboardId}
      path-parameters:
        dashboardId: string
      request: UpdateDashboardRequest
      response: Dashboard
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.ConflictError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    delete:
      docs: Delete a dashboard.
      method: DELETE
      path: /dashboards/{dashboardId}
      path-parameters:
        dashboardId: string
      response: DeleteDashboardResponse
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    addPlacement:
      docs: |
        Add a placement to a dashboard grid (see `DashboardPlacement` for
        grid semantics).

        `id` and the position fields are optional: when omitted, the
        placement gets a server-generated id and is appended below all
        existing tiles as a 6x6 tile. Returns the created placement.

        The referenced widget must exist in the same project or be a
        Langfuse-managed widget. The API returns `409` if a placement with
        the same `id` already exists on the dashboard.

        This endpoint manages classic placements only and preserves inline
        Markdown and multi-query widgets.
      method: POST
      path: /dashboards/{dashboardId}/placements
      path-parameters:
        dashboardId: string
      request: CreateDashboardPlacementRequest
      response: DashboardPlacement
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.ConflictError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    updatePlacement:
      docs: |
        Move or resize a placement. All fields are optional; at least one is
        required. Omitted fields keep their current value. The placement's
        content (widget/preset reference) and id cannot change — delete and
        re-add the placement to swap content. Returns the updated placement.

        This endpoint manages classic placements only and preserves inline
        Markdown and multi-query widgets.
      method: PATCH
      path: /dashboards/{dashboardId}/placements/{placementId}
      path-parameters:
        dashboardId: string
        placementId: string
      request: UpdateDashboardPlacementRequest
      response: DashboardPlacement
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError
    deletePlacement:
      docs: |
        Remove a classic placement from a dashboard grid without deleting the
        referenced widget. Inline Markdown and multi-query widgets are preserved.
      method: DELETE
      path: /dashboards/{dashboardId}/placements/{placementId}
      path-parameters:
        dashboardId: string
        placementId: string
      response: DeleteDashboardPlacementResponse
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.NotFoundError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError

types:
  DashboardPlacement:
    docs: |
      A tile on the dashboard's 12-column grid. `x`/`y` are the tile's
      top-left cell (0-based; `y` grows downward), `width`/`height` its size
      in cells. The UI default tile is 6x6 (half width). Overlapping tiles
      are not rejected; prefer appending below existing tiles (or omit the
      position on create to let the server do it).
    discriminant: type
    union:
      widget:
        type: WidgetPlacement
      preset:
        type: PresetPlacement
  WidgetPlacement:
    properties:
      id: string
      widgetId: string
      x: integer
      y: integer
      width: integer
      height: integer
  PresetPlacement:
    properties:
      id: string
      presetId: string
      x: integer
      y: integer
      width: integer
      height: integer
  CreateDashboardPlacementRequest:
    discriminant: type
    union:
      widget:
        type: CreateWidgetPlacement
      preset:
        type: CreatePresetPlacement
  CreateWidgetPlacement:
    properties:
      id:
        type: optional<string>
        docs: Server-generated when omitted.
      widgetId: string
      x:
        type: optional<integer>
        docs: Grid column (12-column grid). Defaults to `0`.
      y:
        type: optional<integer>
        docs: Grid row. Defaults to the first row below all existing tiles.
      width:
        type: optional<integer>
        docs: Width in grid columns. Defaults to `6`.
      height:
        type: optional<integer>
        docs: Height in grid rows. Defaults to `6`.
  CreatePresetPlacement:
    properties:
      id:
        type: optional<string>
        docs: Server-generated when omitted.
      presetId: string
      x:
        type: optional<integer>
        docs: Grid column (12-column grid). Defaults to `0`.
      y:
        type: optional<integer>
        docs: Grid row. Defaults to the first row below all existing tiles.
      width:
        type: optional<integer>
        docs: Width in grid columns. Defaults to `6`.
      height:
        type: optional<integer>
        docs: Height in grid rows. Defaults to `6`.
  UpdateDashboardPlacementRequest:
    properties:
      x:
        type: optional<integer>
        docs: Grid column (12-column grid).
      y:
        type: optional<integer>
        docs: Grid row.
      width:
        type: optional<integer>
        docs: Width in grid columns.
      height:
        type: optional<integer>
        docs: Height in grid rows.
  DeleteDashboardPlacementResponse:
    properties:
      message: string
  DashboardDefinition:
    docs: |
      Version 1 is returned for classic and supported version 1 dashboards.
      The legacy shape is returned only when the stored root format is newer
      than this server supports. Unsupported entries within a version 1
      document are omitted from the response and preserved in storage.
    discriminated: false
    union:
      - DashboardDefinitionV1
      - LegacyDashboardDefinition
  LegacyDashboardDefinition:
    extra-properties: false
    properties:
      widgets:
        type: list<DashboardPlacement>
        availability:
          status: deprecated
          message: Use version 1 with blocks instead. Legacy writes remain supported and preserve inline widgets.
        docs: Classic widget and preset placements. Kept for existing clients.
  DashboardDefinitionV1:
    properties:
      version: literal<"1">
      blocks: list<DashboardBlock>
      widgets:
        type: list<DashboardPlacement>
        availability:
          status: deprecated
          message: Read blocks instead. This field is a compatibility mirror of classic placements in blocks.
        docs: Compatibility mirror of the classic placements in blocks.
  DashboardDefinitionInput:
    discriminated: false
    union:
      - DashboardDefinitionV1Input
      - LegacyDashboardDefinition
  DashboardDefinitionV1Input:
    docs: |
      `blocks` is authoritative. When `widgets` is supplied, it must match the
      classic placements in `blocks`. Placement and widget IDs must be unique.
      Existing inline widgets must be echoed without changing their content,
      revision, order, or anchor; public credentials cannot mutate them.
    properties:
      version: literal<"1">
      blocks: list<DashboardBlock>
      widgets:
        type: optional<list<DashboardPlacement>>
        availability:
          status: deprecated
          message: Write blocks instead. Omit this compatibility mirror or keep it consistent with blocks.
  DashboardBlock:
    discriminated: false
    union:
      - DashboardPlacement
      - InlineDashboardBlock
  InlineDashboardBlock:
    discriminant: kind
    base-properties:
      id:
        type: uuid
        docs: Stable widget identifier.
      revision:
        type: integer
        docs: Positive revision. Echo the current value unchanged when round-tripping.
      beforePlacementId:
        type: nullable<string>
        docs: Classic placement id before which this widget appears, or null to append.
    union:
      markdown: MarkdownDashboardBlock
      multiQuery: MultiQueryDashboardBlock
      convertedPreset: ConvertedDashboardPreset
  ConvertedDashboardPreset:
    docs: Replaces the contents of the referenced preset placement while retaining its grid position and size. Render the chart in that placement. Its beforePlacementId is null.
    properties:
      sourcePreset: DashboardPresetSource
      config: DashboardMultiQueryConfigV2
  DashboardPresetSource:
    properties:
      placementId: string
      presetId: string
  MarkdownDashboardBlock:
    properties:
      config: DashboardMarkdownConfig
  MultiQueryDashboardBlock:
    properties:
      config: DashboardMultiQueryConfig
  DashboardMarkdownConfig:
    properties:
      version:
        type: integer
        docs: Configuration version. Currently 1.
      title:
        type: string
        docs: At most 255 characters.
      content:
        type: string
        docs: Markdown content, at most 100000 characters.
  DashboardMultiQueryConfig:
    discriminated: false
    union:
      - DashboardMultiQueryConfigV1
      - DashboardMultiQueryConfigV2
  DashboardMultiQueryFormatV1:
    type: integer
    docs: Legacy single-chart configuration. The format version is 1.
    validation:
      min: 1
      max: 1
  DashboardMultiQueryConfigV1:
    properties:
      version: DashboardMultiQueryFormatV1
      title:
        type: string
        docs: Between 1 and 200 characters.
      description:
        type: string
        docs: At most 10000 characters.
      queries:
        type: list<DashboardMultiQuerySource>
        docs: Between 1 and 5 independent source queries with unique ids.
      display: DashboardMultiQueryDisplay
      views:
        type: optional<list<DashboardMultiQueryView>>
        docs: At most 8 named query subsets with unique ids.
      defaultViewId:
        type: optional<string>
        docs: Id of an existing named view.
  DashboardMultiQueryFormatV2:
    type: integer
    docs: Independent tab configurations. The format version is 2.
    validation:
      min: 2
      max: 2
  DashboardMultiQueryConfigV2:
    properties:
      version: DashboardMultiQueryFormatV2
      title: string
      description: string
      tabs:
        type: list<DashboardMultiQueryTab>
        docs: One to nine ordered tabs with unique IDs. The first tab is shown by default.
  DashboardMultiQueryTab:
    properties:
      id: string
      label: string
      queries:
        type: list<DashboardMultiQueryTabSource>
        docs: Between one and five independent source queries.
      display: DashboardMultiQueryDisplay
      formulas:
        type: optional<list<DashboardMultiQueryFormula>>
        docs: Up to five calculations over metrics in this tab.
  DashboardMultiQueryFormula:
    properties:
      id: string
      label:
        type: string
        docs: Set to an empty string to display the formula expression with the current series names. References in the stored expression use query and metric IDs.
      expression:
        type: string
        docs: Arithmetic on queryId.metricId references from this tab, numeric literals, and parentheses. Null or missing operands and division by zero have no value.
      format: DashboardMultiQueryFormulaFormat
      hidden: optional<boolean>
  DashboardMultiQueryFormulaFormat:
    enum:
      - number
      - percent
  DashboardMultiQueryTabSource:
    properties:
      id: string
      label: string
      view: dashboardWidgets.DashboardWidgetViewWithLegacy
      homeCategoryFallback: optional<boolean>
      homeScoreAggregate: optional<boolean>
      metrics: list<DashboardMultiQueryTabMetric>
      dimensions: list<dashboardWidgets.DashboardWidgetDimension>
      filters: list<dashboardWidgets.DashboardWidgetFilter>
      orderBy: optional<nullable<list<DashboardMultiQueryOrder>>>
      hidden:
        type: optional<boolean>
        docs: Keep the source available for formulas without plotting its metrics.
  DashboardMultiQueryTabMetric:
    extends: DashboardMultiQueryMetric
    properties:
      hidden: optional<boolean>
  DashboardMultiQuerySource:
    properties:
      id:
        type: string
        docs: At most 64 characters, starting with a letter and containing only letters, digits and underscores.
      label:
        type: string
        docs: Between 1 and 200 characters.
      view: dashboardWidgets.DashboardWidgetViewWithLegacy
      homeCategoryFallback:
        type: optional<boolean>
        docs: Read an observation cost or usage category time series from its Home data source on the legacy read path.
      homeScoreAggregate:
        type: optional<boolean>
        docs: Use the Home score aggregate on the project's read path. Supports score-record counts and numeric means, grouped by name, source or data type. Use the scores-numeric source with explicit data type filters to select a population.
      metrics:
        type: list<DashboardMultiQueryMetric>
        docs: Between 1 and 5 metrics with unique ids and distinct measure/aggregation pairs.
      dimensions:
        type: list<dashboardWidgets.DashboardWidgetDimension>
        docs: At most 3 grouping dimensions.
      filters: list<dashboardWidgets.DashboardWidgetFilter>
      orderBy:
        type: optional<nullable<list<DashboardMultiQueryOrder>>>
        docs: At most 4 sort fields.
  DashboardMultiQueryMetric:
    properties:
      id:
        type: string
        docs: At most 64 characters, starting with a letter and containing only letters, digits and underscores.
      label: optional<string>
      measure: string
      aggregation: dashboardWidgets.DashboardWidgetMetricAggregation
  DashboardMultiQueryOrder:
    properties:
      field: string
      direction: DashboardMultiQuerySortDirection
  DashboardMultiQuerySortDirection:
    enum:
      - asc
      - desc
  DashboardMultiQueryDisplay:
    properties:
      chartType: dashboardWidgets.DashboardWidgetChartType
      rowLimit:
        type: optional<integer>
        docs: Between 1 and 1000.
      bins:
        type: optional<integer>
        docs: Between 1 and 100.
      legend: optional<boolean>
      subtotalMetric:
        type: optional<string>
        docs: A source.metric reference to a count or sum. The subtotal includes returned groups before table display filters.
      hideUnattributedRows:
        type: optional<boolean>
        docs: Hide table rows with a missing breakdown value.
      timeBuckets:
        type: optional<DashboardTimeBuckets>
        docs: Use the dashboard's time interval or let the analytics query choose one.
  DashboardTimeBuckets:
    enum:
      - auto
      - dashboard
  DashboardMultiQueryView:
    properties:
      id:
        type: string
        docs: At most 64 characters, starting with a letter and containing only letters, digits and underscores.
      label:
        type: string
        docs: Between 1 and 100 characters.
      queryIds:
        type: list<string>
        docs: Between 1 and 5 distinct ids of existing source queries.
  Dashboard:
    properties:
      id: string
      createdAt: datetime
      updatedAt: datetime
      name: string
      description: string
      definition: DashboardDefinition
      filters:
        type: list<dashboardWidgets.DashboardWidgetFilter>
        docs: Dashboard-level filters applied to all widgets on the dashboard.
  DashboardList:
    properties:
      data: list<Dashboard>
      meta: pagination.MetaResponse
  CreateDashboardRequest:
    properties:
      name: string
      description: optional<string>
      definition: optional<DashboardDefinitionInput>
      filters: optional<list<dashboardWidgets.DashboardWidgetFilter>>
  UpdateDashboardRequest:
    properties:
      name: optional<string>
      description: optional<string>
      definition: optional<DashboardDefinitionInput>
      filters: optional<list<dashboardWidgets.DashboardWidgetFilter>>
  DeleteDashboardResponse:
    properties:
      message: string
