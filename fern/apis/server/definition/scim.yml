# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  commons: ./commons.yml

service:
  auth: true
  base-path: /api/public/scim
  endpoints:
    getServiceProviderConfig:
      docs: Get SCIM Service Provider Configuration (requires organization-scoped API key)
      method: GET
      path: /ServiceProviderConfig
      response: ServiceProviderConfig

    getResourceTypes:
      docs: Get SCIM Resource Types (requires organization-scoped API key)
      method: GET
      path: /ResourceTypes
      response: ResourceTypesResponse

    getSchemas:
      docs: Get SCIM Schemas (requires organization-scoped API key)
      method: GET
      path: /Schemas
      response: SchemasResponse

    listUsers:
      docs: List users in the organization (requires organization-scoped API key)
      method: GET
      path: /Users
      request:
        name: ListUsersRequest
        query-parameters:
          filter:
            docs: Filter expression (e.g. userName eq "value")
            type: optional<string>
          startIndex:
            docs: 1-based index of the first result to return (default 1)
            type: optional<integer>
          count:
            docs: Maximum number of results to return (default 100)
            type: optional<integer>
      response: ScimUsersListResponse

    createUser:
      docs: Create a new user in the organization (requires organization-scoped API key)
      method: POST
      path: /Users
      request:
        name: CreateUserRequest
        body:
          properties:
            userName:
              docs: User's email address (required)
              type: string
            name:
              docs: User's name information
              type: ScimName
            emails:
              docs: User's email addresses
              type: optional<list<ScimEmail>>
            active:
              docs: Whether the user is active
              type: optional<boolean>
            password:
              docs: >-
                Ignored. Accepted only for compatibility with identity
                providers that always send a password on user creation (Okta
                sends a placeholder value even when password sync is disabled).
                No credential is created for the user; provisioned users
                authenticate via SSO or set a password themselves through the
                password reset flow.
              type: optional<string>
              availability:
                status: deprecated
                message: "This attribute is ignored. SCIM provisioning never sets a password; provisioned users authenticate via SSO or the password reset flow."
      response: ScimUser

    getUser:
      docs: Get a specific user by ID (requires organization-scoped API key)
      method: GET
      path: /Users/{userId}
      path-parameters:
        userId: string
      response: ScimUser

    deleteUser:
      docs: Remove a user from the organization (requires organization-scoped API key). Note that this only removes the user from the organization but does not delete the user entity itself.
      method: DELETE
      path: /Users/{userId}
      path-parameters:
        userId: string
      response: EmptyResponse

    replaceUser:
      docs: >-
        Replace a user's organization membership (requires organization-scoped
        API key). `active: true` adds the user to the organization, `active:
        false` removes them. When `roles` is set, the first valid role is
        applied to the membership; when it is omitted, an existing membership
        keeps its role and a new one gets the `NONE` role. A request that sends
        `roles` without `active` updates the role of an existing member. Other
        user attributes are ignored.
      method: PUT
      path: /Users/{userId}
      path-parameters:
        userId: string
      request:
        name: ReplaceUserRequest
        body:
          properties:
            schemas:
              docs: Must include `urn:ietf:params:scim:schemas:core:2.0:User`
              type: list<string>
            active:
              docs: Whether the user should be a member of the organization
              type: optional<boolean>
            roles:
              docs: >-
                Organization role to apply. Only the first entry is used. One of
                OWNER, ADMIN, MEMBER, VIEWER, NONE, AI_GATEWAY.
              type: optional<list<string>>
      response: ScimUserSummary

    patchUser:
      docs: >-
        Update a user's organization membership with a SCIM PatchOp (requires
        organization-scoped API key). Only `replace` operations whose value sets
        `active` are supported: `active: true` adds the user to the organization
        with the `NONE` role if they are not a member yet, `active: false`
        removes them.
      method: PATCH
      path: /Users/{userId}
      path-parameters:
        userId: string
      request:
        name: PatchUserRequest
        body: ScimPatchRequest
      response: ScimUser

    listGroups:
      docs: List groups in the organization (requires organization-scoped API key)
      method: GET
      path: /Groups
      request:
        name: ListGroupsRequest
        query-parameters:
          filter:
            docs: Filter expression. Supported are `displayName eq "value"` and `externalId eq "value"`.
            type: optional<string>
          startIndex:
            docs: 1-based index of the first result to return (default 1)
            type: optional<integer>
          count:
            docs: Maximum number of results to return (default and maximum 100)
            type: optional<integer>
          excludedAttributes:
            docs: Comma-separated attributes to leave out of the response. Pass `members` to omit group members.
            type: optional<string>
      response: ScimGroupsListResponse

    createGroup:
      docs: Create a group in the organization (requires organization-scoped API key)
      method: POST
      path: /Groups
      request:
        name: CreateGroupRequest
        body: ScimGroupRequest
      response: ScimGroup

    getGroup:
      docs: Get a specific group by ID (requires organization-scoped API key)
      method: GET
      path: /Groups/{groupId}
      path-parameters:
        groupId: string
      request:
        name: GetGroupRequest
        query-parameters:
          excludedAttributes:
            docs: Comma-separated attributes to leave out of the response. Pass `members` to omit group members.
            type: optional<string>
      response: ScimGroup

    replaceGroup:
      docs: >-
        Replace a group's display name, external ID and members (requires
        organization-scoped API key). Members not listed are removed from the
        group.
      method: PUT
      path: /Groups/{groupId}
      path-parameters:
        groupId: string
      request:
        name: ReplaceGroupRequest
        query-parameters:
          excludedAttributes:
            docs: Comma-separated attributes to leave out of the response. Pass `members` to omit group members.
            type: optional<string>
        body: ScimGroupRequest
      response: ScimGroup

    patchGroup:
      docs: >-
        Update a group with a SCIM PatchOp (requires organization-scoped API
        key). Supports `add`, `remove` and `replace` on `members`, `displayName`
        and `externalId`, `remove` on `members[value eq "<userId>"]`, and
        operations without a path whose value is a partial group.
      method: PATCH
      path: /Groups/{groupId}
      path-parameters:
        groupId: string
      request:
        name: PatchGroupRequest
        query-parameters:
          excludedAttributes:
            docs: Comma-separated attributes to leave out of the response. Pass `members` to omit group members.
            type: optional<string>
        body: ScimPatchRequest
      response: ScimGroup

    deleteGroup:
      docs: Delete a group from the organization (requires organization-scoped API key)
      method: DELETE
      path: /Groups/{groupId}
      path-parameters:
        groupId: string
      response: EmptyResponse

types:
  ServiceProviderConfig:
    properties:
      schemas: list<string>
      documentationUri: string
      patch: ScimFeatureSupport
      bulk: BulkConfig
      filter: FilterConfig
      changePassword: ScimFeatureSupport
      sort: ScimFeatureSupport
      etag: ScimFeatureSupport
      authenticationSchemes: list<AuthenticationScheme>
      meta: ResourceMeta

  ScimFeatureSupport:
    properties:
      supported: boolean

  BulkConfig:
    properties:
      supported: boolean
      maxOperations: integer
      maxPayloadSize: integer

  FilterConfig:
    properties:
      supported: boolean
      maxResults: integer

  ResourceMeta:
    properties:
      resourceType: string
      location: string

  AuthenticationScheme:
    properties:
      name: string
      description: string
      specUri: string
      type: string
      primary: boolean

  ResourceTypesResponse:
    properties:
      schemas: list<string>
      totalResults: integer
      Resources: list<ResourceType>

  ResourceType:
    properties:
      schemas: optional<list<string>>
      id: string
      name: string
      endpoint: string
      description: string
      schema: string
      schemaExtensions: list<SchemaExtension>
      meta: ResourceMeta

  SchemaExtension:
    properties:
      schema: string
      required: boolean

  SchemasResponse:
    properties:
      schemas: list<string>
      totalResults: integer
      Resources: list<SchemaResource>

  SchemaResource:
    properties:
      id: string
      name: string
      description: string
      attributes: list<unknown>
      meta: ResourceMeta

  ScimUsersListResponse:
    properties:
      schemas: list<string>
      totalResults: integer
      startIndex: integer
      itemsPerPage: integer
      Resources: list<ScimUser>

  ScimUser:
    properties:
      schemas: list<string>
      id: string
      userName: string
      name: ScimName
      emails: list<ScimEmail>
      meta: UserMeta

  UserMeta:
    properties:
      resourceType: string
      created: optional<string>
      lastModified: optional<string>

  ScimName:
    properties:
      formatted: optional<string>

  ScimEmail:
    properties:
      primary: boolean
      value: string
      type: string

  ScimUserSummary:
    docs: User returned by a PUT request, without name and emails
    properties:
      schemas: list<string>
      id: string
      userName: string
      meta: UserMeta

  ScimPatchRequest:
    properties:
      schemas:
        docs: Must include `urn:ietf:params:scim:api:messages:2.0:PatchOp`
        type: list<string>
      Operations: list<ScimPatchOperation>

  ScimPatchOperation:
    properties:
      op:
        docs: One of `add`, `remove`, `replace`
        type: string
      path: optional<string>
      value: optional<unknown>

  ScimGroupRequest:
    properties:
      schemas: optional<list<string>>
      displayName: string
      externalId:
        docs: Identifier of the group in the identity provider. Unique within the organization.
        type: optional<string>
      members:
        docs: Users to add to the group. Each user must be a member of the organization.
        type: optional<list<ScimGroupMemberReference>>

  ScimGroupMemberReference:
    properties:
      value:
        docs: SCIM User ID
        type: string

  ScimGroup:
    properties:
      schemas: list<string>
      id: string
      displayName: string
      externalId: optional<string>
      members:
        docs: Omitted when `excludedAttributes=members` is set
        type: optional<list<ScimGroupMember>>
      meta: GroupMeta

  ScimGroupMember:
    properties:
      value:
        docs: SCIM User ID
        type: string
      display:
        docs: User's email address
        type: optional<string>
      $ref:
        name: ref
        type: string
      type: string

  GroupMeta:
    properties:
      resourceType: string
      created: string
      lastModified: string
      location: string

  ScimGroupsListResponse:
    properties:
      schemas: list<string>
      totalResults: integer
      startIndex: integer
      itemsPerPage: integer
      Resources: list<ScimGroup>

  EmptyResponse:
    docs: Empty response for 204 No Content responses
    properties: {}