  <text x="52" y="223" class="label" text-anchor="end">80</text>
  <text x="52" y="173" class="label" text-anchor="end">120</text>
  <text x="52" y="123" class="label" text-anchor="end">160</text>
  <text x="52" y="73"  class="label" text-anchor="end">200s</text>

  <!-- baseline (86s) and checkpoint (114.5s) reference lines, scale: 250px = 200s -> 1.25px/s -->
  <line x1="60" y1="212.5" x2="680" y2="212.5" class="ref-baseline" />
  <text x="600" y="209" class="legend" fill="#16a34a">baseline 86s</text>
