<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="600" fill="#24292f">CI/CD merge_group daily medians — 2026-W37 (2026-09-05..2026-09-11)</text>
  <text x="20" y="40" font-size="11" fill="#57606a">seconds; 09-05/09-06 zero runs, 09-11 excluded (n=2 &lt; 5/day bar)</text>

  <!-- y gridlines and labels: 0..300 -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="70" y1="260" x2="580" y2="260"/>
    <line x1="70" y1="186.7" x2="580" y2="186.7"/>
    <line x1="70" y1="113.3" x2="580" y2="113.3"/>
    <line x1="70" y1="40" x2="580" y2="40"/>
  </g>
  <g font-size="10" fill="#57606a" text-anchor="end">
    <text x="62" y="264">0</text>
    <text x="62" y="190.7">100</text>
    <text x="62" y="117.3">200</text>
    <text x="62" y="44">300</text>
  </g>
  <line x1="70" y1="40" x2="70" y2="260" stroke="#8c959f" stroke-width="1"/>

  <!-- x labels -->
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="70" y="276">09-07</text>
    <text x="233" y="276">09-08</text>
    <text x="397" y="276">09-09</text>
    <text x="560" y="276">09-10</text>
  </g>

  <!-- Perceived (wall) #3987e5 -->
  <polyline fill="none" stroke="#3987e5" stroke-width="2.5"
    points="70,103.4 233,125.4 397,121.4 560,117.0"/>
  <g fill="#3987e5">
    <circle cx="70" cy="103.4" r="3.5"/><circle cx="233" cy="125.4" r="3.5"/>
    <circle cx="397" cy="121.4" r="3.5"/><circle cx="560" cy="117.0" r="3.5"/>
  </g>

  <!-- Execution #de5a20 -->
  <polyline fill="none" stroke="#de5a20" stroke-width="2.5"
    points="70,115.2 233,140.1 397,132.8 560,130.2"/>
  <g fill="#de5a20">
    <circle cx="70" cy="115.2" r="3.5"/><circle cx="233" cy="140.1" r="3.5"/>
    <circle cx="397" cy="132.8" r="3.5"/><circle cx="560" cy="130.2" r="3.5"/>
  </g>

  <!-- Runner wait #8875e0 -->
  <polyline fill="none" stroke="#8875e0" stroke-width="2.5"
    points="70,248.3 233,245.3 397,248.6 560,246.8"/>
  <g fill="#8875e0">
    <circle cx="70" cy="248.3" r="3.5"/><circle cx="233" cy="245.3" r="3.5"/>
    <circle cx="397" cy="248.6" r="3.5"/><circle cx="560" cy="246.8" r="3.5"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#24292f">
    <rect x="70" y="296" width="11" height="11" fill="#3987e5"/>
    <text x="87" y="305">Perceived (wall) — median 192s</text>
    <rect x="262" y="296" width="11" height="11" fill="#de5a20"/>
    <text x="279" y="305">Execution — 175.3s</text>
    <rect x="418" y="296" width="11" height="11" fill="#8875e0"/>
    <text x="435" y="305">Runner wait — 17s</text>
  </g>
</svg>
