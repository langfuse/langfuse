<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .line-perceived { fill: none; stroke: #3987e5; stroke-width: 2.5; }
    .line-execution { fill: none; stroke: #de5a20; stroke-width: 2.5; }
    .line-wait { fill: none; stroke: #8875e0; stroke-width: 2.5; }
    .dot-perceived { fill: #3987e5; }
    .dot-execution { fill: #de5a20; }
    .dot-wait { fill: #8875e0; }
    .label { fill: #334155; font-size: 12px; }
    .title { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .legend { fill: #475569; font-size: 11px; }
    .legend-title { fill: #1e293b; font-size: 12px; font-weight: 600; }
  </style>

  <text x="20" y="24" class="title">Daily merge-group medians: pipeline totals (2026-08-12..08-18)</text>
  <text x="20" y="42" class="legend">Trailing 7 calendar days ending 2026-08-18 (08-15 Sat omitted, 0 runs). 08-18 is a partial day (4 runs so far).</text>

  <!-- plot area: x=70..700, y=90..340, 0..700s scale -->
  <line x1="70" y1="340" x2="700" y2="340" class="axis" />
  <line x1="70" y1="90"  x2="70"  y2="340" class="axis" />
  <g class="grid">
    <line x1="70" y1="304.3" x2="700" y2="304.3" />
    <line x1="70" y1="268.6" x2="700" y2="268.6" />
    <line x1="70" y1="232.9" x2="700" y2="232.9" />
    <line x1="70" y1="197.1" x2="700" y2="197.1" />
    <line x1="70" y1="161.4" x2="700" y2="161.4" />
    <line x1="70" y1="125.7" x2="700" y2="125.7" />
    <line x1="70" y1="90"   x2="700" y2="90" />
  </g>
  <text x="62" y="343" class="label" text-anchor="end">0</text>
  <text x="62" y="307.3" class="label" text-anchor="end">100</text>
  <text x="62" y="271.6" class="label" text-anchor="end">200</text>
  <text x="62" y="235.9" class="label" text-anchor="end">300</text>
  <text x="62" y="200.1" class="label" text-anchor="end">400</text>
  <text x="62" y="164.4" class="label" text-anchor="end">500</text>
  <text x="62" y="128.7" class="label" text-anchor="end">600</text>
  <text x="62" y="93"   class="label" text-anchor="end">700s</text>

  <text x="70"  y="358" class="label" text-anchor="middle">08-12</text>
  <text x="196" y="358" class="label" text-anchor="middle">08-13</text>
  <text x="322" y="358" class="label" text-anchor="middle">08-14</text>
  <text x="448" y="358" class="label" text-anchor="middle">08-16</text>
  <text x="574" y="358" class="label" text-anchor="middle">08-17</text>
  <text x="700" y="358" class="label" text-anchor="middle">08-18*</text>

  <!-- overall incl. wait (perceived) -->
  <polyline class="line-perceived" points="70.0,220.0 196.0,98.6 322.0,257.9 448.0,270.7 574.0,268.2 700.0,268.0" />
  <!-- overall excl. wait (execution) -->
  <polyline class="line-execution" points="70.0,230.7 196.0,101.8 322.0,266.1 448.0,276.1 574.0,273.6 700.0,274.6" />
  <!-- runner wait -->
  <polyline class="line-wait" points="70.0,331.1 196.0,336.8 322.0,334.6 448.0,334.6 574.0,334.3 700.0,333.4" />

  <g>
    <circle cx="70.0" cy="220.0" r="3.5" class="dot-perceived" /><circle cx="196.0" cy="98.6" r="3.5" class="dot-perceived" /><circle cx="322.0" cy="257.9" r="3.5" class="dot-perceived" /><circle cx="448.0" cy="270.7" r="3.5" class="dot-perceived" /><circle cx="574.0" cy="268.2" r="3.5" class="dot-perceived" /><circle cx="700.0" cy="268.0" r="3.5" class="dot-perceived" />
    <circle cx="70.0" cy="230.7" r="3.5" class="dot-execution" /><circle cx="196.0" cy="101.8" r="3.5" class="dot-execution" /><circle cx="322.0" cy="266.1" r="3.5" class="dot-execution" /><circle cx="448.0" cy="276.1" r="3.5" class="dot-execution" /><circle cx="574.0" cy="273.6" r="3.5" class="dot-execution" /><circle cx="700.0" cy="274.6" r="3.5" class="dot-execution" />
    <circle cx="70.0" cy="331.1" r="3.5" class="dot-wait" /><circle cx="196.0" cy="336.8" r="3.5" class="dot-wait" /><circle cx="322.0" cy="334.6" r="3.5" class="dot-wait" /><circle cx="448.0" cy="334.6" r="3.5" class="dot-wait" /><circle cx="574.0" cy="334.3" r="3.5" class="dot-wait" /><circle cx="700.0" cy="333.4" r="3.5" class="dot-wait" />
  </g>

  <!-- legend, top-right corner, clear of data -->
  <g>
    <rect x="560" y="58" width="14" height="4" fill="#3987e5" />
    <text x="580" y="64" class="legend">overall incl. wait</text>
    <rect x="560" y="70" width="14" height="4" fill="#de5a20" />
    <text x="580" y="76" class="legend">overall excl. wait</text>
    <rect x="560" y="82" width="14" height="4" fill="#8875e0" />
    <text x="580" y="88" class="legend">runner wait</text>
  </g>

  <text x="20" y="378" class="legend">* 08-13/08-14: whole-suite proportional slowdown (~5x transform/import/tests) -- CI-runner contention (Blacksmith), not a code regression; not 3+ consecutive days, so not actionable.</text>
  <text x="20" y="394" class="legend">08-16/08-17/08-18 form a stable ~194-207s perceived-time band, consistent with the pre-outlier baseline. Pooled weekly p50=231s, p90~680s (29 runs) vs baseline p50=396s, p90=522s.</text>
</svg>
