# Optional local JSON log rotation for the bundled self-hosted services.
# Explicitly overrides the daemon's logging driver; see README.md (Docker log rotation).
# Usage: docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  langfuse-worker:
    logging: *bounded-logging
  langfuse-web:
    logging: *bounded-logging
  clickhouse:
    logging: *bounded-logging
  minio:
    logging: *bounded-logging
  redis:
    logging: *bounded-logging
  postgres:
    logging: *bounded-logging
